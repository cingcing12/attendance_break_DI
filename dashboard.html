<!DOCTYPE html>
<html lang="km" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Khmer:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['"Inter"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                        khmer: ['"Noto Sans Khmer"', 'sans-serif']
                    },
                    colors: { 
                        dark: "#050505",
                        card: "#121212",
                        primary: "#6366f1", 
                    },
                    animation: {
                        'enter': 'enter 0.5s ease-out forwards',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        enter: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },

        body { background-color: #000; color: #e5e5e5; font-family: 'Noto Sans Khmer', sans-serif; -webkit-tap-highlight-color: transparent; }

        .glass-nav { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 40; }
        .glass-card { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        /* Custom SweetAlert Theme */
        div:where(.swal2-container) div:where(.swal2-popup) {
            background: rgba(20, 20, 20, 0.95) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 16px;

        .tab-btn.active { background-color: #6366f1; color: white; box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); border-color: rgba(99, 102, 241, 0.5); }
        
        #print-container { position: absolute; top: -9999px; left: -9999px; width: 800px; background: white; color: black; padding: 40px; font-family: 'Noto Sans Khmer', sans-serif; }
        select option { background-color: #121212; color: white; }

</head>

    <script>
        const API_URL = "http://localhost:3000"; 
        
        let currentMode = 'daily';
        let availableSheets = [];
        let fetchedData = []; 
        let debounceTimer; 
        let printMode = 'daily';
        let staffCacheData = [];
        let pollingInterval = null;

        // --- AUTHENTICATION LOGIC ---

        // Check if user is already logged in (localStorage)
        if(localStorage.getItem('admin_token')) {
            showDashboard();
        } else {
            // Icons are initialized automatically by script below
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.querySelector('button[type="submit"]');
            const btnText = document.getElementById('btn-text');

            // Loading state
            btn.disabled = true;
            btnText.innerText = "កំពុងផ្ទៀងផ្ទាត់...";
            
            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('admin_token', data.token); // PERSISTENCE
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'ជោគជ័យ',
                        text: 'សូមស្វាគមន៍មកកាន់ប្រព័ន្ធ',
                        timer: 1500,
                        showConfirmButton: false,
                        background: '#1e1e1e',
                        color: '#fff'
                    }).then(() => {
                        showDashboard();
                    });

                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'បរាជ័យ',
                        text: 'អ៊ីមែល ឬ ពាក្យសម្ងាត់មិនត្រឹមត្រូវ!',
                        confirmButtonColor: '#d33',
                        background: '#1e1e1e',
                        color: '#fff'
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Cannot connect to server',
                    background: '#1e1e1e',
                    color: '#fff'
                });
            } finally {
                btn.disabled = false;
                btnText.innerText = "ចូលប្រព័ន្ធ";
            }
        }

        function handleLogout() {
            localStorage.removeItem('admin_token');
            if(pollingInterval) clearInterval(pollingInterval);
            window.location.reload();
        }

        function showDashboard() {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('dashboard-view').classList.add('flex');
            initDashboard(); // Only load data now
        }

        // --- DASHBOARD DATA LOGIC (Only runs after login) ---

        async function initDashboard() {
            lucide.createIcons();
            try {
                showLoading(); 
                
                const staffRes = await fetch(`${API_URL}/staff`);
                if(staffRes.ok) staffCacheData = await staffRes.json();

                const res = await fetch(`${API_URL}/available-sheets`);
                if (!res.ok) throw new Error('API Error');
                availableSheets = await res.json();
                
                const today = new Date();
                const day = String(today.getDate()).padStart(2, '0');
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const year = today.getFullYear();
                
                populateFilter('daily', `${day}-${month}-${year}`);
                await fetchReport(false); 
                startPolling();

            } catch (error) {
                console.error(error);
                document.getElementById('view-title').innerText = "ការតភ្ជាប់បរាជ័យ";
                document.getElementById('view-title').classList.add("text-rose-500");
                hideLoading();
            }
        }

        function startPolling() {
            if(pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(() => { fetchReport(true); }, 3000); 
        }

        function showLoading(text = "កំពុងផ្ទុកទិន្នន័យ") {
            document.getElementById('loader-text').innerText = text;
            document.getElementById('loading-overlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        function populateFilter(mode, defaultVal = '') {
            const select = document.getElementById('dateFilter');
            select.innerHTML = '';
            let options = [];
            
            if (mode === 'daily') options = [...availableSheets].reverse(); 
            else if (mode === 'monthly') options = Array.from(new Set(availableSheets.map(s => s.substring(3))));
            else if (mode === 'yearly') options = Array.from(new Set(availableSheets.map(s => s.substring(6))));

            if(options.length === 0) {
                const el = document.createElement('option');
                el.innerText = "No Data";
                select.appendChild(el);
            } else {
                options.forEach(opt => {
                    const el = document.createElement('option');
                    el.value = opt;
                    el.innerText = opt;
                    if(opt === defaultVal) el.selected = true;
                    select.appendChild(el);
                });
                if(!options.includes(defaultVal) && select.options.length > 0) select.selectedIndex = 0;
            }
        }

        function changeMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.className = "tab-btn flex-1 sm:flex-none px-5 py-2 rounded-md text-xs font-bold text-slate-400 hover:text-white transition-all duration-200 font-khmer");
            document.getElementById(`btn-${mode}`).className = "tab-btn active flex-1 sm:flex-none px-5 py-2 rounded-md text-xs font-bold transition-all duration-200 font-khmer";

            const currentVal = document.getElementById('dateFilter').value;
            let nextVal = '';
            if(currentVal && currentVal !== "No Data") {
                if (mode === 'monthly' && currentVal.length === 10) nextVal = currentVal.substring(3);
                if (mode === 'yearly') nextVal = currentVal.substring(currentVal.length - 4);
            }
            populateFilter(mode, nextVal);
            manualFetch();
        }

        function manualFetch() { fetchReport(false); }

        async function fetchReport(isBackground = false) {
            const filterVal = document.getElementById('dateFilter').value;
            if (!isBackground) showLoading();

            if(!filterVal || filterVal === "No Data") {
                 updateStats([]);
                 renderView();
                 if (!isBackground) hideLoading();
                 return;
            }

            try {
                const res = await fetch(`${API_URL}/report?mode=${currentMode}&filter=${filterVal}`);
                if (res.status === 429) return; 
                const data = await res.json();
                fetchedData = data.raw;
                updateStats(fetchedData);
                renderView();
            } catch (e) {
                console.error("Polling Error:", e);
                if (!isBackground) {
                    // Only alert if manual load fails, prevent alert spam on polling
                }
            } finally {
                if (!isBackground) hideLoading();
            }
        }

        function updateStats(data) {
            const uniqueStaff = new Set(data.map(item => item.id)).size;
            const otCount = data.filter(item => item.overtime && item.overtime !== "0").length;
            const filterTxt = document.getElementById('dateFilter').value;
            document.getElementById('stat-total-staff').innerText = uniqueStaff;
            document.getElementById('stat-total-breaks').innerText = data.length;
            document.getElementById('stat-total-ot').innerText = otCount;
            const modeText = currentMode === 'daily' ? 'ប្រចាំថ្ងៃ' : currentMode === 'monthly' ? 'ប្រចាំខែ' : 'ប្រចាំឆ្នាំ';
            document.getElementById('view-title').innerText = `${modeText}: ${filterTxt}`;
        }

        function renderView() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = fetchedData.filter(item => item.name.toLowerCase().includes(searchTerm) || item.id.toString().includes(searchTerm));

            const viewGrid = document.getElementById('view-grid');
            const viewTable = document.getElementById('view-table');
            const emptyState = document.getElementById('empty-state');

            if(filtered.length === 0) {
                viewGrid.classList.add('hidden');
                viewTable.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            if (currentMode === 'daily') {
                viewGrid.classList.remove('hidden');
                viewTable.classList.add('hidden');
                renderGrid(filtered);
            } else {
                viewGrid.classList.add('hidden');
                viewTable.classList.remove('hidden');
                renderTable(filtered);
            }
        }

        function renderGrid(data) {
            const container = document.getElementById('view-grid');
            const userGroups = {};
            data.forEach(log => {
                if(!userGroups[log.id]) userGroups[log.id] = { ...log, breaks: [] };
                userGroups[log.id].breaks.push(log);
            });

            const sortedUsers = Object.values(userGroups).sort((a,b) => {
                 const aActive = !a.breaks[a.breaks.length-1].timeIn;
                 const bActive = !b.breaks[b.breaks.length-1].timeIn;
                 return bActive - aActive; 
            });

            const newHTML = sortedUsers.map(user => {
                const staffInfo = staffCacheData.find(s => s.id == user.id);
                const khName = staffInfo ? (staffInfo.name_kh || staffInfo.name_en) : user.name;
                const enName = staffInfo ? (staffInfo.name_en || "") : "";
                const groupName = staffInfo ? (staffInfo.group || user.group) : user.group;
                const imgUrl = user.image || `https://ui-avatars.com/api/?background=random&color=fff&background=6366f1&name=${encodeURIComponent(user.name)}`;
                const lastBreak = user.breaks[user.breaks.length - 1];
                const isActive = !lastBreak.timeIn;
                const borderClass = isActive ? 'border-indigo-500/50 shadow-[0_0_15px_rgba(99,102,241,0.15)] bg-indigo-900/10' : 'border-white/5 hover:border-white/10';
                const statusDot = isActive ? '<div class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full border-2 border-[#141414] animate-pulse"></div>' : '';
                
                const timelineHtml = user.breaks.map(b => `
                    <div class="timeline-item relative pl-4 pb-3 last:pb-0">
                        <div class="timeline-line absolute left-[4.5px] top-[6px] bottom-0 w-[1px] bg-white/10"></div>
                        <div class="absolute left-0 top-[6px] w-2.5 h-2.5 rounded-full border-2 border-[#171717] ${!b.timeIn ? 'bg-indigo-500 shadow-[0_0_8px_rgba(99,102,241,0.6)]' : 'bg-slate-700'}"></div>
                        <div class="flex justify-between items-start text-xs">
                            <div class="flex flex-col">
                                <span class="text-slate-300 font-mono">${b.timeOut}</span>
                                ${!b.timeIn ? '<span class="text-[10px] text-indigo-400 font-bold mt-0.5 tracking-wider font-khmer">កំពុងសម្រាក</span>' : ''}
                            </div>
                            <div class="text-right">
                                <span class="text-slate-500 font-mono">${b.timeIn || '...'}</span>
                                ${(b.overtime && b.overtime !== '0') ? `<div class="text-[10px] text-rose-500 font-bold mt-0.5">+${b.overtime} នាទី</div>` : ''}
                            </div>
                        </div>
                    </div>
                `).join('');

                return `
                    <div class="glass-card p-4 rounded-xl border ${borderClass} transition-all duration-300">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="relative">
                                <img src="${imgUrl}" class="w-12 h-12 rounded-full object-cover bg-slate-800 border border-white/10">
                                ${statusDot}
                            </div>
                            <div class="overflow-hidden">
                                <h4 class="text-white font-bold text-sm truncate font-khmer">${khName}</h4>
                                <p class="text-slate-400 text-xs truncate">${enName}</p>
                                <p class="text-slate-500 text-xs truncate">#${user.id} • ${groupName}</p>
                            </div>
                        </div>
                        <div class="bg-black/30 rounded-lg p-3 border border-white/5">
                            ${timelineHtml}
                        </div>
                    </div>
                `;
            }).join('');
            container.innerHTML = newHTML;
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            const aggregation = {};
            data.forEach(log => {
                if(!aggregation[log.id]) aggregation[log.id] = { ...log, breakCount: 0, otCount: 0 };
                aggregation[log.id].breakCount++;
                if(log.overtime && log.overtime !== "0") aggregation[log.id].otCount++;
            });
            const sorted = Object.values(aggregation).sort((a,b) => b.breakCount - a.breakCount);
            const newHTML = sorted.map(user => {
                const staffInfo = staffCacheData.find(s => s.id == user.id);
                const khName = staffInfo ? (staffInfo.name_kh || staffInfo.name_en) : user.name;
                const enName = staffInfo ? (staffInfo.name_en || "") : "";
                const groupName = staffInfo ? (staffInfo.group || user.group) : user.group;
                const imgUrl = user.image || `https://ui-avatars.com/api/?background=random&name=${encodeURIComponent(user.name)}`;
                const otDisplay = user.otCount > 0 ? `<span class="inline-flex items-center px-2 py-1 rounded bg-rose-500/10 text-rose-400 border border-rose-500/20 text-xs font-bold font-khmer">${user.otCount} លើក</span>` : `<span class="text-slate-600 text-xs">-</span>`;

                return `
                    <tr class="hover:bg-white/5 transition-colors group">
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                                <img src="${imgUrl}" class="w-8 h-8 rounded-full bg-slate-800 object-cover">
                                <div>
                                    <div class="font-bold text-white text-sm font-khmer">${khName}</div>
                                    <div class="text-xs text-slate-500">${enName} #${user.id}</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4"><span class="px-2 py-1 rounded bg-white/5 text-slate-400 text-xs border border-white/5">${groupName}</span></td>
                        <td class="px-6 py-4 text-center"><span class="font-mono text-white text-sm">${user.breakCount}</span></td>
                        <td class="px-6 py-4 text-center">${otDisplay}</td>
                    </tr>
                `;
            }).join('');
            tbody.innerHTML = newHTML;
        }

        // Print functions
        function openPrintModal() { document.getElementById('print-modal').classList.remove('hidden'); setPrintMode('daily'); }
        function closePrintModal() { document.getElementById('print-modal').classList.add('hidden'); }
        function setPrintMode(mode) {
            printMode = mode;
            document.querySelectorAll('.print-mode-btn').forEach(btn => {
                btn.className = "print-mode-btn bg-white/5 text-slate-400 py-2 rounded-lg text-sm font-bold border border-white/5 hover:bg-white/10 transition-all font-khmer";
            });
            document.getElementById(`pm-${mode}`).className = "print-mode-btn bg-indigo-600 text-white py-2 rounded-lg text-sm font-bold border border-transparent shadow-lg shadow-indigo-500/20 transition-all font-khmer";
            const select = document.getElementById('print-range-select');
            select.innerHTML = '';
            let options = [];
            if (mode === 'daily') options = [...availableSheets].reverse(); 
            else if (mode === 'monthly') options = Array.from(new Set(availableSheets.map(s => s.substring(3))));
            else if (mode === 'yearly') options = Array.from(new Set(availableSheets.map(s => s.substring(6))));
            options.forEach(opt => {
                const el = document.createElement('option');
                el.value = opt;
                el.innerText = opt;
                select.appendChild(el);
            });
        }
        async function executePrint() {
            const range = document.getElementById('print-range-select').value;
            if(!range) return;
            closePrintModal();
            showLoading("កំពុងបង្កើត PDF...");
            try {
                const res = await fetch(`${API_URL}/report?mode=${printMode}&filter=${range}`);
                const json = await res.json();
                const dataToPrint = json.raw;
                if (dataToPrint.length === 0) { alert("មិនមានទិន្នន័យសម្រាប់ការជ្រើសរើសនេះទេ។"); hideLoading(); return; }
                const aggregation = {};
                dataToPrint.forEach(log => {
                    if(!aggregation[log.id]) {
                        const staff = staffCacheData.find(s => s.id == log.id);
                        const khName = staff ? (staff.name_kh || staff.name_en) : log.name;
                        const groupName = staff ? (staff.group || log.group) : log.group;
                        aggregation[log.id] = { id: log.id, name: khName, group: groupName, breakCount: 0, otCount: 0 };
                    }
                    aggregation[log.id].breakCount++;
                    if(log.overtime && log.overtime !== "0") aggregation[log.id].otCount++;
                });
                const rows = Object.values(aggregation).sort((a,b) => b.breakCount - a.breakCount);
                const printContainer = document.getElementById('print-container');
                printContainer.innerHTML = `
                    <div style="padding: 20px; font-family: 'Noto Sans Khmer', sans-serif;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px;">
                            <h1 style="font-size: 24px; font-weight: bold; color: #000;">របាយការណ៍សម្រាកបុគ្គលិក</h1>
                            <div style="text-align: right;">
                                <p style="font-size: 12px; color: #555;">បង្កើតនៅ: ${new Date().toLocaleString('km-KH')}</p>
                                <p style="font-size: 14px; font-weight: bold; color: #000;">រយៈពេល: ${range}</p>
                            </div>
                        </div>
                        <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
                            <thead>
                                <tr style="background-color: #4f46e5; color: white;">
                                    <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">អត្តលេខ</th>
                                    <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">ឈ្មោះ</th>
                                    <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">ផ្នែក</th>
                                    <th style="padding: 10px; border: 1px solid #ddd; text-align: center;">ចំនួនសម្រាក</th>
                                    <th style="padding: 10px; border: 1px solid #ddd; text-align: center;">លើសម៉ោង</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows.map((row, index) => `
                                    <tr style="background-color: ${index % 2 === 0 ? '#ffffff' : '#f9fafb'}; color: #000;">
                                        <td style="padding: 8px; border: 1px solid #ddd;">${row.id}</td>
                                        <td style="padding: 8px; border: 1px solid #ddd; font-family: 'Noto Sans Khmer', sans-serif;">${row.name}</td>
                                        <td style="padding: 8px; border: 1px solid #ddd;">${row.group}</td>
                                        <td style="padding: 8px; border: 1px solid #ddd; text-align: center;">${row.breakCount}</td>
                                        <td style="padding: 8px; border: 1px solid #ddd; text-align: center; color: ${row.otCount > 0 ? 'red' : 'black'}; font-weight: ${row.otCount > 0 ? 'bold' : 'normal'};">${row.otCount}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                        <div style="margin-top: 20px; font-size: 12px; color: #000; border-top: 1px solid #000; padding-top: 10px;">
                            <p><strong>បុគ្គលិកសរុប:</strong> ${rows.length}</p>
                            <p><strong>កំណត់ត្រាសរុប:</strong> ${dataToPrint.length}</p>
                        </div>
                    </div>
                `;
                const { jsPDF } = window.jspdf;
                const canvas = await html2canvas(printContainer, { scale: 2 });
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                pdf.save(`Attendance_${range}.pdf`);
            } catch (e) { alert("មានបញ្ហាក្នុងការបង្កើត PDF"); } 
            finally { hideLoading(); document.getElementById('print-container').innerHTML = ''; }
        }

        // Initialize Icons
        lucide.createIcons();
    </script>
</body>
</html>
