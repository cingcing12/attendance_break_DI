<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Analytics Dashboard Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['"Inter"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'] 
                    },
                    colors: { 
                        dark: "#050505",
                        card: "#121212",
                        primary: "#6366f1", 
                    },
                    animation: {
                        'enter': 'enter 0.3s ease-out forwards',
                    },
                    keyframes: {
                        enter: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000; color: #e5e5e5; -webkit-tap-highlight-color: transparent; }
        .bg-glow { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: -1; pointer-events: none; background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15), transparent 40%); }
        .glass-nav { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 40; }
        .glass-card { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        #loading-overlay { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); z-index: 9999; }
        .timeline-line::before { content: ''; position: absolute; top: 12px; bottom: -12px; left: 5px; width: 2px; background: #27272a; z-index: 0; }
        .timeline-item:last-child .timeline-line::before { display: none; }
        .tab-btn.active { background-color: #6366f1; color: white; box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); border-color: rgba(99, 102, 241, 0.5); }
        
        /* Select Styling */
        select option { background-color: #121212; color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-12">

    <div class="bg-glow"></div>

    <div id="loading-overlay" class="fixed inset-0 flex flex-col items-center justify-center hidden transition-opacity duration-300">
        <div class="relative w-20 h-20 mb-4">
            <div class="absolute inset-0 border-4 border-indigo-500/30 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <div class="absolute inset-4 bg-indigo-500/20 rounded-full animate-pulse"></div>
        </div>
        <h3 class="text-white font-bold text-lg tracking-widest" id="loader-text">LOADING DATA</h3>
        <p class="text-slate-400 text-sm mt-1">Please wait...</p>
    </div>

    <div id="print-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#0a0a0a] border border-white/10 rounded-2xl w-full max-w-sm p-6 shadow-2xl transform scale-100 transition-all ring-1 ring-white/10">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="printer" class="text-indigo-500 w-5 h-5"></i> Export Report
                </h3>
                <button onclick="closePrintModal()" class="text-slate-500 hover:text-white transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Report Type</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setPrintMode('daily')" id="pm-daily" class="print-mode-btn bg-indigo-600 text-white py-2 rounded-lg text-sm font-bold border border-transparent shadow-lg shadow-indigo-500/20">Daily</button>
                        <button onclick="setPrintMode('monthly')" id="pm-monthly" class="print-mode-btn bg-white/5 text-slate-400 py-2 rounded-lg text-sm font-bold border border-white/5 hover:bg-white/10">Monthly</button>
                        <button onclick="setPrintMode('yearly')" id="pm-yearly" class="print-mode-btn bg-white/5 text-slate-400 py-2 rounded-lg text-sm font-bold border border-white/5 hover:bg-white/10">Yearly</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Select Range</label>
                    <div class="relative">
                        <i data-lucide="calendar-days" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <select id="print-range-select" class="w-full bg-white/5 border border-white/10 text-white text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-10 p-3 appearance-none transition-all">
                            </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-slate-500">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="executePrint()" class="mt-8 w-full py-3.5 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 shadow-xl shadow-indigo-900/20 transition-all flex items-center justify-center gap-2">
                <i data-lucide="download"></i> Download PDF
            </button>
        </div>
    </div>

    <nav class="glass-nav sticky top-0 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 md:px-6 py-4">
            
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                        <i data-lucide="bar-chart-2" class="text-white w-5 h-5"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-bold text-white tracking-tight">Staff Analytics</h1>
                        <div class="flex items-center gap-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            <p class="text-[10px] text-slate-400 font-mono uppercase">System Online</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-px bg-white/10 rounded-lg p-px overflow-hidden">
                    <div class="bg-black/80 px-4 py-2 text-center">
                        <span class="text-[10px] text-slate-500 block">STAFF</span>
                        <span class="text-sm font-bold text-white" id="stat-total-staff">0</span>
                    </div>
                    <div class="bg-black/80 px-4 py-2 text-center">
                        <span class="text-[10px] text-slate-500 block">LOGS</span>
                        <span class="text-sm font-bold text-emerald-400" id="stat-total-breaks">0</span>
                    </div>
                    <div class="bg-black/80 px-4 py-2 text-center">
                        <span class="text-[10px] text-slate-500 block">ALERTS</span>
                        <span class="text-sm font-bold text-rose-500" id="stat-total-ot">0</span>
                    </div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <div class="flex p-1 bg-white/5 rounded-lg border border-white/5 w-full sm:w-auto">
                    <button onclick="changeMode('daily')" id="btn-daily" class="tab-btn active flex-1 sm:flex-none px-5 py-2 rounded-md text-xs font-bold text-slate-400 hover:text-white transition-all duration-200">Daily</button>
                    <button onclick="changeMode('monthly')" id="btn-monthly" class="tab-btn flex-1 sm:flex-none px-5 py-2 rounded-md text-xs font-bold text-slate-400 hover:text-white transition-all duration-200">Monthly</button>
                    <button onclick="changeMode('yearly')" id="btn-yearly" class="tab-btn flex-1 sm:flex-none px-5 py-2 rounded-md text-xs font-bold text-slate-400 hover:text-white transition-all duration-200">Yearly</button>
                </div>

                <div class="relative flex-grow">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="calendar" class="h-4 w-4 text-slate-500"></i></div>
                    <select id="dateFilter" onchange="fetchReport()" class="w-full bg-white/5 text-white text-sm rounded-lg border border-white/5 pl-9 pr-8 py-2.5 focus:ring-1 focus:ring-indigo-500 focus:bg-white/10 outline-none appearance-none transition-all">
                        <option>Loading...</option>
                    </select>
                </div>

                <div class="relative flex-grow-[2]">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="search" class="h-4 w-4 text-slate-500"></i></div>
                    <input type="text" id="searchInput" class="w-full bg-white/5 text-white text-sm rounded-lg border border-white/5 pl-9 pr-4 py-2.5 focus:ring-1 focus:ring-indigo-500 focus:bg-white/10 outline-none placeholder-slate-600 transition-all" placeholder="Search staff...">
                </div>

                <button onclick="openPrintModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded-lg transition-colors flex items-center justify-center shadow-lg shadow-indigo-500/20 active:scale-95">
                    <i data-lucide="printer" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto w-full px-4 md:px-6 mt-8">
        <div class="flex items-end justify-between mb-6">
            <h2 class="text-xl font-bold text-white" id="view-title">Activity Feed</h2>
        </div>

        <div id="view-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 animate-enter"></div>

        <div id="view-table" class="hidden animate-enter">
            <div class="glass-card rounded-xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-400">
                        <thead class="bg-white/5 text-xs uppercase font-bold text-slate-300">
                            <tr>
                                <th class="px-6 py-4">Employee</th>
                                <th class="px-6 py-4">Group</th>
                                <th class="px-6 py-4 text-center">Breaks</th>
                                <th class="px-6 py-4 text-center">Overtime</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-white/5" id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="empty-state" class="hidden flex-col items-center justify-center py-32 text-center">
            <div class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center mb-4"><i data-lucide="coffee" class="w-8 h-8 text-slate-600"></i></div>
            <h3 class="text-white font-bold">No Data Found</h3>
            <p class="text-slate-500 text-sm mt-1">Try selecting a different date or filter.</p>
        </div>
    </main>

    <script>
        const API_URL = "https://attendance-break-di.onrender.com"; 
        
        let currentMode = 'daily';
        let availableSheets = [];
        let fetchedData = []; 
        let debounceTimer; 
        
        // Print Logic Variables
        let printMode = 'daily';
        
        lucide.createIcons();

        // --- APP START ---
        async function init() {
            try {
                showLoading();
                const res = await fetch(`${API_URL}/available-sheets`);
                if (!res.ok) throw new Error('API Error');
                availableSheets = await res.json();
                
                const today = new Date();
                const day = String(today.getDate()).padStart(2, '0');
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const year = today.getFullYear();
                
                populateFilter('daily', `${day}-${month}-${year}`);
                fetchReport();
            } catch (error) {
                console.error(error);
                document.getElementById('view-title').innerText = "Connection Failed";
                document.getElementById('view-title').classList.add("text-rose-500");
                hideLoading();
            }
        }

        // --- LOADING UI ---
        function showLoading(text = "LOADING DATA") {
            document.getElementById('loader-text').innerText = text;
            document.getElementById('loading-overlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        // --- PRINT MODAL LOGIC ---
        function openPrintModal() {
            document.getElementById('print-modal').classList.remove('hidden');
            setPrintMode('daily'); // Reset to default
        }

        function closePrintModal() {
            document.getElementById('print-modal').classList.add('hidden');
        }

        function setPrintMode(mode) {
            printMode = mode;
            
            // Update Buttons UI
            document.querySelectorAll('.print-mode-btn').forEach(btn => {
                btn.className = "print-mode-btn bg-white/5 text-slate-400 py-2 rounded-lg text-sm font-bold border border-white/5 hover:bg-white/10 transition-all";
            });
            const activeBtn = document.getElementById(`pm-${mode}`);
            activeBtn.className = "print-mode-btn bg-indigo-600 text-white py-2 rounded-lg text-sm font-bold border border-transparent shadow-lg shadow-indigo-500/20 transition-all";

            // Populate Dropdown
            const select = document.getElementById('print-range-select');
            select.innerHTML = '';
            let options = [];

            if (mode === 'daily') options = [...availableSheets].reverse(); 
            else if (mode === 'monthly') options = Array.from(new Set(availableSheets.map(s => s.substring(3))));
            else if (mode === 'yearly') options = Array.from(new Set(availableSheets.map(s => s.substring(6))));

            options.forEach(opt => {
                const el = document.createElement('option');
                el.value = opt;
                el.innerText = opt;
                select.appendChild(el);
            });
        }

        async function executePrint() {
            const range = document.getElementById('print-range-select').value;
            if(!range) return;

            closePrintModal();
            showLoading("GENERATING PDF...");

            try {
                // Fetch data for the specific print request
                const res = await fetch(`${API_URL}/report?mode=${printMode}&filter=${range}`);
                const json = await res.json();
                const dataToPrint = json.raw;

                if (dataToPrint.length === 0) {
                    alert("No data found for this selection.");
                    hideLoading();
                    return;
                }

                // Aggregate Data
                const aggregation = {};
                dataToPrint.forEach(log => {
                    if(!aggregation[log.id]) {
                        aggregation[log.id] = {
                            id: log.id,
                            name: log.name,
                            group: log.group,
                            breakCount: 0,
                            otCount: 0
                        };
                    }
                    aggregation[log.id].breakCount++;
                    if(log.overtime && log.overtime !== "0") aggregation[log.id].otCount++;
                });
                const rows = Object.values(aggregation).sort((a,b) => b.breakCount - a.breakCount);

                // Initialize PDF
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                // Custom Header
                doc.setFillColor(30, 30, 30); // Dark Header Background
                doc.rect(0, 0, 210, 25, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(14);
                doc.setFont("helvetica", "bold");
                doc.text("ATTENDANCE BREAK REPORT", 14, 16);
                
                doc.setFontSize(9);
                doc.setFont("helvetica", "normal");
                doc.setTextColor(200, 200, 200);
                doc.text(`Period: ${range}`, 14, 32);
                doc.text(`Generated: ${new Date().toLocaleString()}`, 140, 16);

                const tableBody = rows.map(row => [
                    row.id,
                    row.name,
                    row.group,
                    row.breakCount,
                    row.otCount
                ]);

                // Elegant Table Style
                doc.autoTable({
                    head: [['ID', 'NAME', 'DEPARTMENT', 'TOTAL BREAKS', 'OVERTIME INCIDENTS']],
                    body: tableBody,
                    startY: 35,
                    theme: 'grid', // Clean grid
                    styles: { 
                        fontSize: 9, 
                        cellPadding: 4, 
                        valign: 'middle', 
                        font: 'helvetica',
                        textColor: [50, 50, 50]
                    },
                    headStyles: { 
                        fillColor: [79, 70, 229], // Indigo 600
                        textColor: [255, 255, 255],
                        fontStyle: 'bold',
                        lineWidth: 0
                    },
                    alternateRowStyles: { 
                        fillColor: [248, 250, 252] // Very light gray for zebra stripe
                    },
                    columnStyles: {
                        0: { cellWidth: 20, fontStyle: 'bold' },
                        3: { halign: 'center' },
                        4: { halign: 'center', textColor: [220, 38, 38], fontStyle: 'bold' }
                    },
                    // Add summary footer
                    didDrawPage: function(data) {
                        // Footer logic if needed
                    }
                });

                // Add Summary at bottom of last page
                const finalY = doc.lastAutoTable.finalY + 10;
                doc.setFontSize(10);
                doc.setTextColor(0, 0, 0);
                doc.text(`Total Staff Active: ${rows.length}`, 14, finalY);
                doc.text(`Total Records: ${dataToPrint.length}`, 14, finalY + 6);

                doc.save(`Attendance_${range}.pdf`);

            } catch (e) {
                console.error(e);
                alert("Error generating PDF");
            } finally {
                hideLoading();
            }
        }

        // --- DASHBOARD LOGIC ---
        function populateFilter(mode, defaultVal = '') {
            const select = document.getElementById('dateFilter');
            select.innerHTML = '';
            let options = [];
            
            if (mode === 'daily') options = [...availableSheets].reverse(); 
            else if (mode === 'monthly') options = Array.from(new Set(availableSheets.map(s => s.substring(3))));
            else if (mode === 'yearly') options = Array.from(new Set(availableSheets.map(s => s.substring(6))));

            if(options.length === 0) {
                const el = document.createElement('option');
                el.innerText = "No Data";
                select.appendChild(el);
            } else {
                options.forEach(opt => {
                    const el = document.createElement('option');
                    el.value = opt;
                    el.innerText = opt;
                    if(opt === defaultVal) el.selected = true;
                    select.appendChild(el);
                });
                if(!options.includes(defaultVal) && select.options.length > 0) select.selectedIndex = 0;
            }
        }

        function changeMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.className = "tab-btn flex-1 sm:flex-none px-5 py-2 rounded-md text-xs font-bold text-slate-400 hover:text-white transition-all duration-200");
            document.getElementById(`btn-${mode}`).className = "tab-btn active flex-1 sm:flex-none px-5 py-2 rounded-md text-xs font-bold transition-all duration-200";

            const currentVal = document.getElementById('dateFilter').value;
            let nextVal = '';
            if(currentVal && currentVal !== "No Data") {
                if (mode === 'monthly' && currentVal.length === 10) nextVal = currentVal.substring(3);
                if (mode === 'yearly') nextVal = currentVal.substring(currentVal.length - 4);
            }

            populateFilter(mode, nextVal);
            fetchReport();
        }

        async function fetchReport() {
            const filterVal = document.getElementById('dateFilter').value;
            showLoading();

            if(!filterVal || filterVal === "No Data") {
                 updateStats([]);
                 renderView();
                 hideLoading();
                 return;
            }

            try {
                const res = await fetch(`${API_URL}/report?mode=${currentMode}&filter=${filterVal}`);
                if (res.status === 429) {
                     alert("System busy. Please wait a moment.");
                     hideLoading();
                     return;
                }
                const data = await res.json();
                fetchedData = data.raw;
                
                updateStats(fetchedData);
                renderView();
            } catch (e) {
                console.error(e);
                alert("Failed to load data");
            } finally {
                hideLoading();
            }
        }

        function updateStats(data) {
            const uniqueStaff = new Set(data.map(item => item.id)).size;
            const otCount = data.filter(item => item.overtime && item.overtime !== "0").length;
            const filterTxt = document.getElementById('dateFilter').value;

            document.getElementById('stat-total-staff').innerText = uniqueStaff;
            document.getElementById('stat-total-breaks').innerText = data.length;
            document.getElementById('stat-total-ot').innerText = otCount;
            document.getElementById('view-title').innerText = `${currentMode === 'daily' ? 'Daily' : currentMode === 'monthly' ? 'Monthly' : 'Yearly'}: ${filterTxt}`;
        }

        function renderView() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = fetchedData.filter(item => 
                item.name.toLowerCase().includes(searchTerm) || 
                item.id.toString().includes(searchTerm)
            );

            const viewGrid = document.getElementById('view-grid');
            const viewTable = document.getElementById('view-table');
            const emptyState = document.getElementById('empty-state');

            viewGrid.classList.add('hidden');
            viewTable.classList.add('hidden');
            emptyState.classList.add('hidden');

            if(filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            if (currentMode === 'daily') {
                viewGrid.classList.remove('hidden');
                renderGrid(filtered);
            } else {
                viewTable.classList.remove('hidden');
                renderTable(filtered);
            }
        }

        function renderGrid(data) {
            const container = document.getElementById('view-grid');
            container.innerHTML = '';

            const userGroups = {};
            data.forEach(log => {
                if(!userGroups[log.id]) userGroups[log.id] = { ...log, breaks: [] };
                userGroups[log.id].breaks.push(log);
            });

            const sortedUsers = Object.values(userGroups).sort((a,b) => {
                 const aActive = !a.breaks[a.breaks.length-1].timeIn;
                 const bActive = !b.breaks[b.breaks.length-1].timeIn;
                 return bActive - aActive;
            });

            sortedUsers.forEach(user => {
                const imgUrl = user.image || `https://ui-avatars.com/api/?background=random&color=fff&background=6366f1&name=${encodeURIComponent(user.name)}`;
                const lastBreak = user.breaks[user.breaks.length - 1];
                const isActive = !lastBreak.timeIn;
                
                const borderClass = isActive ? 'border-indigo-500/50 shadow-[0_0_15px_rgba(99,102,241,0.15)]' : 'border-white/5 hover:border-white/10';
                const statusDot = isActive ? '<div class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full border-2 border-[#141414] animate-pulse"></div>' : '';
                
                const timelineHtml = user.breaks.map(b => `
                    <div class="timeline-item relative pl-4 pb-3 last:pb-0">
                        <div class="timeline-line absolute left-[4.5px] top-[6px] bottom-0 w-[1px] bg-white/10"></div>
                        <div class="absolute left-0 top-[6px] w-2.5 h-2.5 rounded-full border-2 border-[#171717] ${!b.timeIn ? 'bg-indigo-500 shadow-[0_0_8px_rgba(99,102,241,0.6)]' : 'bg-slate-700'}"></div>
                        
                        <div class="flex justify-between items-start text-xs">
                            <div class="flex flex-col">
                                <span class="text-slate-300 font-mono">${b.timeOut}</span>
                                ${!b.timeIn ? '<span class="text-[10px] text-indigo-400 font-bold mt-0.5 tracking-wider">ACTIVE</span>' : ''}
                            </div>
                            <div class="text-right">
                                <span class="text-slate-500 font-mono">${b.timeIn || '...'}</span>
                                ${(b.overtime && b.overtime !== '0') ? `<div class="text-[10px] text-rose-500 font-bold mt-0.5">+${b.overtime} OT</div>` : ''}
                            </div>
                        </div>
                    </div>
                `).join('');

                const card = document.createElement('div');
                card.className = `glass-card p-4 rounded-xl border ${borderClass} transition-all duration-300`;
                card.innerHTML = `
                    <div class="flex items-center gap-3 mb-4">
                        <div class="relative">
                            <img src="${imgUrl}" class="w-12 h-12 rounded-full object-cover bg-slate-800 border border-white/10">
                            ${statusDot}
                        </div>
                        <div class="overflow-hidden">
                            <h4 class="text-white font-bold text-sm truncate">${user.name}</h4>
                            <p class="text-slate-500 text-xs truncate">#${user.id} • ${user.group}</p>
                        </div>
                    </div>
                    <div class="bg-black/30 rounded-lg p-3 border border-white/5">
                        ${timelineHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const aggregation = {};
            data.forEach(log => {
                if(!aggregation[log.id]) aggregation[log.id] = { ...log, breakCount: 0, otCount: 0 };
                aggregation[log.id].breakCount++;
                if(log.overtime && log.overtime !== "0") aggregation[log.id].otCount++;
            });

            const sorted = Object.values(aggregation).sort((a,b) => b.breakCount - a.breakCount);

            sorted.forEach(user => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-white/5 transition-colors group";
                
                const imgUrl = user.image || `https://ui-avatars.com/api/?background=random&name=${encodeURIComponent(user.name)}`;
                const otDisplay = user.otCount > 0 
                    ? `<span class="inline-flex items-center px-2 py-1 rounded bg-rose-500/10 text-rose-400 border border-rose-500/20 text-xs font-bold">${user.otCount} Alerts</span>` 
                    : `<span class="text-slate-600 text-xs">-</span>`;

                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <img src="${imgUrl}" class="w-8 h-8 rounded-full bg-slate-800 object-cover">
                            <div>
                                <div class="font-bold text-white text-sm">${user.name}</div>
                                <div class="text-xs text-slate-500">#${user.id}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4"><span class="px-2 py-1 rounded bg-white/5 text-slate-400 text-xs border border-white/5">${user.group}</span></td>
                    <td class="px-6 py-4 text-center"><span class="font-mono text-white text-sm">${user.breakCount}</span></td>
                    <td class="px-6 py-4 text-center">${otDisplay}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                renderView();
            }, 300);
        });

        init();
    </script>
</body>
</html>
