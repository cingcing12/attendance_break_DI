<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Staff Hub Pro - Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Khmer:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Outfit"', 'sans-serif'],
                        khmer: ['"Noto Sans Khmer"', 'sans-serif']
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'pop-in': 'popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'pulse-danger': 'pulseDanger 2s infinite',
                        'float': 'float 6s ease-in-out infinite'
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.9) translateY(20px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
                        },
                        pulseDanger: {
                            '0%': { boxShadow: '0 0 0 0 rgba(244, 63, 94, 0.4)' },
                            '70%': { boxShadow: '0 0 0 15px rgba(244, 63, 94, 0)' },
                            '100%': { boxShadow: '0 0 0 0 rgba(244, 63, 94, 0)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 20px; }

        div:where(.swal2-container) div:where(.swal2-popup) {
            background: #0f172a !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
        }
        .swal2-title { color: #fff !important; font-family: 'Noto Sans Khmer', sans-serif !important; }
        .swal2-html-container { color: #94a3b8 !important; }
    </style>
</head>
<body class="flex flex-col antialiased selection:bg-cyan-500 selection:text-white">

    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-purple-600/20 rounded-full mix-blend-screen filter blur-[100px] animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-[400px] h-[400px] bg-cyan-600/20 rounded-full mix-blend-screen filter blur-[100px] animate-blob" style="animation-delay: 2s"></div>
        <div class="absolute bottom-[-10%] left-[20%] w-[600px] h-[600px] bg-rose-600/20 rounded-full mix-blend-screen filter blur-[100px] animate-blob" style="animation-delay: 4s"></div>
    </div>

    <div id="view-selection" class="relative z-50 min-h-screen flex flex-col items-center justify-center p-6">
        <div class="glass-panel p-8 md:p-12 rounded-[3rem] w-full max-w-2xl text-center relative overflow-hidden animate-pop-in">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-1/2 h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-50"></div>

            <div class="mb-10 animate-float">
                <div class="w-20 h-20 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-cyan-500/30 mb-6 rotate-3 hover:rotate-6 transition-transform">
                    <i data-lucide="zap" class="w-10 h-10 text-white fill-white/20"></i>
                </div>
                <h1 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400 tracking-tight mb-2">Staff Hub</h1>
                <p class="text-slate-400 font-medium font-khmer">ជ្រើសរើសទីតាំងរបស់អ្នក</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <button onclick="enterArea('A')" class="group relative bg-slate-800/40 hover:bg-blue-600/20 border border-white/5 hover:border-blue-500/50 rounded-3xl p-6 transition-all duration-300 hover:scale-[1.02]">
                    <div class="absolute inset-0 bg-blue-500/5 blur-xl group-hover:opacity-100 opacity-0 transition-opacity"></div>
                    <div class="relative flex flex-col items-center">
                        <div class="w-14 h-14 bg-blue-600 rounded-full flex items-center justify-center text-2xl font-bold text-white shadow-lg shadow-blue-500/40 mb-4 group-hover:scale-110 transition-transform">A</div>
                        <h2 class="text-xl font-bold text-white mb-1">តំបន់ A</h2>
                        <span class="text-xs font-semibold text-blue-400 uppercase tracking-widest font-khmer">អាហារដ្ឋាន</span>
                    </div>
                </button>

                <button onclick="enterArea('B')" class="group relative bg-slate-800/40 hover:bg-rose-600/20 border border-white/5 hover:border-rose-500/50 rounded-3xl p-6 transition-all duration-300 hover:scale-[1.02]">
                    <div class="absolute inset-0 bg-rose-500/5 blur-xl group-hover:opacity-100 opacity-0 transition-opacity"></div>
                    <div class="relative flex flex-col items-center">
                        <div class="w-14 h-14 bg-rose-600 rounded-full flex items-center justify-center text-2xl font-bold text-white shadow-lg shadow-rose-500/40 mb-4 group-hover:scale-110 transition-transform">B</div>
                        <h2 class="text-xl font-bold text-white mb-1">តំបន់ B</h2>
                        <span class="text-xs font-semibold text-rose-400 uppercase tracking-widest font-khmer">សួនច្បារ</span>
                    </div>
                </button>
            </div>
            
            <div id="loader-initial" class="mt-8 h-6 flex justify-center items-center"></div>
        </div>
    </div>

    <div id="view-dashboard" class="relative z-40 hidden flex-col min-h-screen">
        
        <header class="sticky top-4 z-50 px-4 mb-2">
            <div class="glass-panel rounded-2xl p-3 max-w-7xl mx-auto flex flex-col gap-3 shadow-2xl">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <button onclick="goBack()" class="w-10 h-10 flex items-center justify-center bg-white/5 hover:bg-white/10 rounded-full transition text-slate-300 border border-white/5 active:scale-95">
                            <i data-lucide="chevron-left" class="w-6 h-6"></i>
                        </button>
                        <div>
                            <div class="flex items-center gap-2">
                                <h1 class="font-bold text-lg text-white leading-none tracking-tight">Staff Portal</h1>
                                <span id="displayAreaBadge" class="px-2 py-0.5 rounded-full text-[10px] font-black bg-gradient-to-r from-blue-500 to-cyan-500 text-white shadow-sm">AREA A</span>
                            </div>
                            <p class="text-[10px] text-slate-400 font-khmer mt-0.5">កំពុងសម្រាក: <span id="itemCount" class="text-white font-bold text-sm">0</span> នាក់</p>
                        </div>
                    </div>

                    <div class="relative w-40 sm:w-64 group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="search" class="w-4 h-4 text-slate-500 group-focus-within:text-cyan-400 transition-colors"></i>
                        </div>
                        <input type="text" id="searchBar" class="block w-full pl-10 pr-3 py-2.5 bg-slate-900/50 border border-white/10 rounded-xl text-sm placeholder-slate-500 text-white focus:outline-none focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/50 transition-all font-khmer" placeholder="ស្វែងរក...">
                    </div>
                </div>

                <div class="bg-slate-900/60 p-1.5 rounded-xl flex w-full relative isolate">
                    <button onclick="switchTab('staff')" id="tab-staff" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition-all duration-300 flex justify-center items-center gap-2 font-khmer relative z-10 bg-slate-700 text-white shadow-md">
                        <i data-lucide="layout-grid" class="w-4 h-4"></i> បញ្ជីបុគ្គលិក
                    </button>
                    <button onclick="switchTab('active')" id="tab-active" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition-all duration-300 flex justify-center items-center gap-2 font-khmer relative z-10 text-slate-400 hover:text-white">
                        <i data-lucide="timer" class="w-4 h-4"></i> កំពុងសម្រាក
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-grow px-4 pb-24 pt-2">
            <div class="max-w-7xl mx-auto min-h-[60vh]">
                
                <div id="container-staff">
                    <div id="staff-placeholder" class="flex flex-col items-center justify-center py-32 text-center opacity-40">
                        <div class="w-20 h-20 bg-gradient-to-tr from-slate-700 to-slate-800 rounded-full flex items-center justify-center mb-4 shadow-inner">
                            <i data-lucide="search-code" class="w-10 h-10 text-slate-400"></i>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-1 font-khmer">ស្វែងរកបុគ្គលិក</h3>
                        <p class="text-slate-400 text-sm">ចាប់ផ្តើមវាយបញ្ចូលឈ្មោះ ឬអាយឌី</p>
                    </div>

                    <div id="staffGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"></div>
                </div>

                <div id="container-active" class="hidden">
                    <div id="no-active" class="hidden flex flex-col items-center justify-center py-32 opacity-40">
                        <div class="w-20 h-20 bg-slate-800/50 rounded-full flex items-center justify-center mb-4 border border-white/5">
                            <i data-lucide="coffee" class="w-10 h-10 text-slate-500"></i>
                        </div>
                        <p class="text-slate-400 font-khmer">មិនមានអ្នកសម្រាកទេ</p>
                    </div>
                    <div id="activeGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"></div>
                </div>

            </div>
        </main>
    </div>

    <script>
        const API_URL = "http://localhost:3000";
        
        let allStaff = [];
        let activeBreaks = [];
        let currentArea = null;
        let currentTab = 'staff';
        let refreshTimer = null;
        let minuteTimer = null;
        let staffCacheData = [];

        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 2000,
            timerProgressBar: true,
            background: '#1e293b',
            color: '#fff',
            customClass: { popup: 'border border-white/10 rounded-xl shadow-2xl' }
        });

        // --- CORE LOGIC ---
        async function loadData() {
            try {
                document.getElementById('loader-initial').innerHTML = '<i data-lucide="loader-2" class="animate-spin text-cyan-400 w-5 h-5"></i>';
                lucide.createIcons();
                
                const staffRes = await fetch(`${API_URL}/staff`);
                if(staffRes.ok) staffCacheData = await staffRes.json();
                
                await fetchData(true);
                
                refreshTimer = setInterval(() => fetchData(false), 3000);
                minuteTimer = setInterval(() => updateTimeDisplays(), 1000);
                document.getElementById('loader-initial').innerHTML = '';
            } catch (err) {
                document.getElementById('loader-initial').innerHTML = '<span class="text-rose-500 text-xs font-bold">Connection Failed</span>';
            }
        }

        async function fetchData(isInitial = false) {
            try {
                const [resStaff, resBreaks] = await Promise.all([
                    fetch(`${API_URL}/staff`),
                    fetch(`${API_URL}/active-breaks`)
                ]);
                const newStaff = await resStaff.json();
                const newBreaks = await resBreaks.json();

                // Always update state variables
                allStaff = newStaff;
                activeBreaks = newBreaks;

                // Force update UI if specific tab is active
                if(currentTab === 'active' || isInitial) {
                    updateUI(false); 
                }
            } catch (e) { console.error("Sync Error", e); }
        }

        function updateUI(disableAnimation) {
            if (currentTab === 'active') {
                renderActiveBreaks(activeBreaks);
            } else if (currentTab === 'staff') {
                const searchTerm = document.getElementById('searchBar').value.toLowerCase();
                if (searchTerm.length > 0) {
                    const filtered = allStaff.filter(p => 
                        (p.name_kh && p.name_kh.toLowerCase().includes(searchTerm)) || 
                        (p.name_en && p.name_en.toLowerCase().includes(searchTerm)) || 
                        (p.id && p.id.toString().includes(searchTerm))
                    );
                    renderStaff(filtered);
                }
            }
        }

        // --- RENDER FUNCTIONS ---
        
        function renderStaff(list) {
            const grid = document.getElementById('staffGrid');
            const placeholder = document.getElementById('staff-placeholder');
            
            grid.innerHTML = '';
            document.getElementById('itemCount').innerText = list.length;

            if (list.length === 0) return placeholder.classList.remove('hidden');
            placeholder.classList.add('hidden');

            list.forEach((person, index) => {
                const breakData = activeBreaks.find(b => b.id == person.id && !b.timeIn);
                const isOnBreak = !!breakData;
                
                // Color Logic
                const btnColor = isOnBreak ? 'bg-slate-700 cursor-not-allowed' : (currentArea === 'A' ? 'bg-gradient-to-r from-blue-600 to-cyan-600 hover:shadow-cyan-500/30' : 'bg-gradient-to-r from-rose-600 to-pink-600 hover:shadow-pink-500/30');
                
                // UX: Tell user WHERE they are breaking if not in current area
                let btnText = "ចេញសម្រាក";
                let statusBadge = "";
                
                if(isOnBreak) {
                    const breakArea = breakData.area || "?";
                    if(breakArea !== currentArea) {
                        btnText = `កំពុងនៅ Zone ${breakArea}`;
                    } else {
                        btnText = "កំពុងសម្រាក";
                    }
                }
                
                const opacity = isOnBreak ? 'opacity-60 grayscale' : '';
                
                const card = document.createElement('div');
                card.className = `glass-card rounded-2xl p-4 flex flex-col items-center relative group animate-pop-in ${opacity}`;
                card.style.animationDelay = `${index * 50}ms`;

                const imgUrl = person.image || `https://ui-avatars.com/api/?background=random&color=fff&name=${encodeURIComponent(person.name_en)}`;

                card.innerHTML = `
                    <div class="absolute top-3 left-3 px-2 py-0.5 bg-slate-950/50 border border-white/10 rounded-md text-[10px] font-mono text-slate-400 font-bold tracking-wider">#${person.id}</div>
                    
                    <div class="relative mb-3 mt-2">
                        <div class="absolute inset-0 bg-gradient-to-tr from-white/20 to-transparent rounded-full blur-md opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                        <img src="${imgUrl}" class="w-20 h-20 rounded-full object-cover shadow-2xl border-[3px] border-slate-800 relative z-10">
                        ${isOnBreak ? '<div class="absolute bottom-0 right-0 w-5 h-5 bg-slate-500 border-2 border-slate-900 rounded-full flex items-center justify-center z-20"><i data-lucide="clock" class="w-3 h-3 text-white"></i></div>' : '<div class="absolute bottom-0 right-0 w-5 h-5 bg-emerald-500 border-2 border-slate-900 rounded-full z-20 shadow-[0_0_10px_rgba(16,185,129,0.5)]"></div>'}
                    </div>

                    <div class="text-center w-full mb-3">
                        <h3 class="font-bold text-white text-base truncate font-khmer leading-snug">${person.name_kh || person.name_en}</h3>
                        <p class="text-[11px] text-slate-400 font-medium truncate uppercase tracking-wide">${person.group || 'Employee'}</p>
                    </div>

                    <button ${isOnBreak ? 'disabled' : ''} onclick='confirmStartBreak(${JSON.stringify(person).replace(/'/g, "&#39;")})' 
                        class="w-full ${btnColor} text-white py-2.5 rounded-xl font-bold text-xs shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-2 font-khmer">
                        ${isOnBreak ? '<i data-lucide="coffee" class="w-3.5 h-3.5"></i>' : '<i data-lucide="log-out" class="w-3.5 h-3.5"></i>'} ${btnText}
                    </button>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function renderActiveBreaks(list) {
            const grid = document.getElementById('activeGrid');
            const emptyMsg = document.getElementById('no-active');
            
            // STRICT FILTERING: Only show items that match the CURRENT Area
            const filteredList = list.filter(item => String(item.area).trim() === String(currentArea).trim());
            document.getElementById('itemCount').innerText = filteredList.length;

            if (filteredList.length === 0) {
                // If filtered list is empty, CLEAR grid to avoid ghosts
                grid.innerHTML = '';
                return emptyMsg.classList.remove('hidden');
            }
            emptyMsg.classList.add('hidden');

            // Cleanup: Remove cards that shouldn't be here (including those from other zones)
            const newIds = new Set(filteredList.map(i => i.id));
            Array.from(grid.children).forEach(card => {
                if (!newIds.has(card.dataset.id)) card.remove();
            });

            filteredList.forEach((item, index) => {
                const existingCard = document.getElementById(`break-card-${item.id}`);
                if (existingCard) {
                    existingCard.dataset.timeout = item.timeOut;
                } else {
                    const staffInfo = staffCacheData.find(s => s.id == item.id);
                    const khName = staffInfo ? (staffInfo.name_kh || staffInfo.name_en) : item.name;
                    const imgUrl = item.image || (staffInfo ? staffInfo.image : `https://ui-avatars.com/api/?background=random&name=${encodeURIComponent(item.name)}`);
                    
                    const card = document.createElement('div');
                    card.id = `break-card-${item.id}`;
                    card.dataset.id = item.id;
                    card.dataset.timeout = item.timeOut;
                    card.className = "glass-card rounded-2xl p-4 flex flex-col items-center relative animate-pop-in border border-white/5 bg-slate-800/40";
                    card.style.animationDelay = `${index * 50}ms`;

                    card.innerHTML = `
                        <div id="status-glow-${item.id}" class="absolute inset-0 rounded-2xl opacity-0 transition-opacity duration-500 pointer-events-none"></div>
                        
                        <div class="relative mb-3 mt-1">
                            <img src="${imgUrl}" class="w-16 h-16 rounded-full object-cover border-2 border-white/10 shadow-lg bg-slate-900">
                             <div id="badge-icon-${item.id}" class="absolute -top-1 -right-1 w-6 h-6 bg-emerald-500 rounded-full flex items-center justify-center border-2 border-slate-900 shadow-lg text-white font-bold text-[10px]">
                                <i data-lucide="check" class="w-3 h-3"></i>
                            </div>
                        </div>

                        <div class="text-center w-full px-1 mb-3">
                            <h3 class="font-bold text-white text-sm truncate font-khmer">${khName}</h3>
                            <div class="flex items-center justify-center gap-1 mt-1 text-[10px] text-slate-500">
                                <i data-lucide="clock" class="w-3 h-3"></i>
                                <span>${item.timeOut}</span>
                            </div>
                        </div>

                        <div class="bg-slate-950/60 rounded-xl p-3 w-full mb-3 border border-white/5 relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-0.5 bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
                            <div class="text-center">
                                <p class="text-[9px] text-slate-500 uppercase font-bold tracking-widest font-sans mb-1">DURATION</p>
                                <p id="time-val-${item.id}" class="text-3xl font-black text-white font-mono tracking-tight tabular-nums">00</p>
                                <p class="text-[10px] text-slate-500 font-khmer mt-[-2px]">នាទី</p>
                            </div>
                        </div>

                        <button onclick="confirmTimeIn('${item.id}', '${khName}')" 
                            class="w-full bg-slate-700 hover:bg-emerald-600 text-white py-3 rounded-xl font-bold text-xs shadow-lg transition-colors flex items-center justify-center gap-2 active:scale-95 group font-khmer">
                            <span class="group-hover:hidden flex items-center gap-2"><i data-lucide="log-in" class="w-3.5 h-3.5"></i> ចូលធ្វើការ</span>
                            <span class="hidden group-hover:flex items-center gap-2"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> បញ្ជាក់</span>
                        </button>
                    `;
                    grid.appendChild(card);
                }
            });
            lucide.createIcons();
        }

        function updateTimeDisplays() {
            if (currentTab !== 'active') return;
            
            document.querySelectorAll('[id^="break-card-"]').forEach(card => {
                const timeOut = card.dataset.timeout;
                const id = card.dataset.id;
                if (!timeOut) return;

                const minsGone = getMinutesDiff(timeOut);
                const isOvertime = minsGone > 15;
                const overtimeAmt = minsGone - 15;

                const timeEl = document.getElementById(`time-val-${id}`);
                if (timeEl && timeEl.innerText !== String(minsGone)) {
                    timeEl.innerText = minsGone;
                    timeEl.style.color = isOvertime ? '#fb7185' : '#fff';
                }

                const glowEl = document.getElementById(`status-glow-${id}`);
                const badgeIcon = document.getElementById(`badge-icon-${id}`);
                
                if (isOvertime) {
                    if(!card.classList.contains('border-rose-500/30')) {
                        card.classList.add('border-rose-500/30', 'animate-pulse-glow');
                        card.classList.remove('border-white/5');
                        glowEl.className = "absolute inset-0 rounded-2xl bg-rose-500/10 animate-pulse-danger pointer-events-none opacity-100";
                        badgeIcon.className = "absolute -top-1 -right-1 w-6 h-6 bg-rose-500 rounded-full flex items-center justify-center border-2 border-slate-900 shadow-lg text-white font-bold text-[10px] animate-bounce";
                        badgeIcon.innerHTML = `<span class="font-bold">+${overtimeAmt}</span>`;
                    }
                }
            });
        }

        function getMinutesDiff(timeStr) {
            const now = new Date();
            const [time, modifier] = timeStr.split(' ');
            let [hours, minutes] = time.split(':');
            hours = parseInt(hours);
            if (hours === 12 && modifier === 'AM') hours = 0;
            if (hours !== 12 && modifier === 'PM') hours += 12;
            const breakTime = new Date();
            breakTime.setHours(hours, parseInt(minutes), 0);
            if (breakTime > now) breakTime.setDate(breakTime.getDate() - 1);
            return Math.floor((now - breakTime) / 60000);
        }

        // --- NAVIGATION ---
        function enterArea(area) {
            if(allStaff.length === 0) return;
            currentArea = area;
            
            // -----------------------------------------------------
            // CRITICAL FIX: HARD RESET OF GRIDS TO PREVENT FLICKER
            // -----------------------------------------------------
            document.getElementById('activeGrid').innerHTML = '';
            document.getElementById('staffGrid').innerHTML = '';
            // -----------------------------------------------------

            const badge = document.getElementById('displayAreaBadge');
            badge.innerText = `AREA ${area}`;
            if(area === 'A') badge.className = "px-2 py-0.5 rounded-full text-[10px] font-black bg-gradient-to-r from-blue-500 to-cyan-500 text-white shadow-lg shadow-cyan-500/30";
            else badge.className = "px-2 py-0.5 rounded-full text-[10px] font-black bg-gradient-to-r from-rose-500 to-pink-500 text-white shadow-lg shadow-rose-500/30";

            document.getElementById('view-selection').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            document.getElementById('view-dashboard').classList.add('flex');
            
            switchTab('staff');
        }

        function goBack() {
            currentArea = null;
            document.getElementById('activeGrid').innerHTML = ''; // Clear on exit too
            document.getElementById('staffGrid').innerHTML = '';
            
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('flex');
            document.getElementById('view-selection').classList.remove('hidden');
            const panel = document.querySelector('#view-selection .glass-panel');
            panel.classList.remove('animate-pop-in');
            void panel.offsetWidth; 
            panel.classList.add('animate-pop-in');
        }

        function switchTab(tab) {
            currentTab = tab;
            const btnStaff = document.getElementById('tab-staff');
            const btnActive = document.getElementById('tab-active');
            const searchBar = document.getElementById('searchBar');

            if (tab === 'staff') {
                btnStaff.className = "flex-1 py-2.5 rounded-lg text-xs font-bold transition-all duration-300 flex justify-center items-center gap-2 font-khmer relative z-10 bg-slate-700 text-white shadow-md shadow-slate-900/20";
                btnActive.className = "flex-1 py-2.5 rounded-lg text-xs font-bold transition-all duration-300 flex justify-center items-center gap-2 font-khmer relative z-10 text-slate-400 hover:text-white";
                
                document.getElementById('container-staff').classList.remove('hidden');
                document.getElementById('container-active').classList.add('hidden');
                
                searchBar.value = '';
                document.getElementById('staffGrid').innerHTML = '';
                document.getElementById('staff-placeholder').classList.remove('hidden');
                document.getElementById('itemCount').innerText = "0";
            } else {
                btnStaff.className = "flex-1 py-2.5 rounded-lg text-xs font-bold transition-all duration-300 flex justify-center items-center gap-2 font-khmer relative z-10 text-slate-400 hover:text-white";
                btnActive.className = "flex-1 py-2.5 rounded-lg text-xs font-bold transition-all duration-300 flex justify-center items-center gap-2 font-khmer relative z-10 bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-lg shadow-emerald-500/20";
                
                document.getElementById('container-staff').classList.add('hidden');
                document.getElementById('container-active').classList.remove('hidden');
                
                searchBar.value = '';
                fetchData(true);
            }
        }

        function confirmStartBreak(person) {
            const color = currentArea === 'A' ? '#06b6d4' : '#f43f5e'; 
            Swal.fire({
                title: 'ចាប់ផ្តើមសម្រាក?',
                html: `<div class="mt-4 flex flex-col items-center">
                        <div class="p-1 rounded-full border-2 border-dashed border-slate-600 mb-4">
                            <img src="${person.image || 'https://via.placeholder.com/100'}" class="w-20 h-20 rounded-full object-cover">
                        </div>
                        <h3 class="text-xl font-bold text-white font-khmer">${person.name_kh || person.name_en}</h3>
                        <p class="text-slate-400 text-sm mt-1 font-khmer">តំបន់ <span style="color:${color}; font-weight:bold;">${currentArea}</span></p>
                       </div>`,
                showCancelButton: true,
                confirmButtonText: 'យល់ព្រម',
                cancelButtonText: 'ទេ',
                confirmButtonColor: color,
                cancelButtonColor: '#334155',
                background: '#0f172a',
                backdrop: `rgba(0,0,0,0.8)`
            }).then((result) => {
                if (result.isConfirmed) submitBreak(person);
            });
        }

        async function submitBreak(person) {
            try {
                await fetch(`${API_URL}/break`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: person.id, name: person.name_kh || person.name_en, group: person.group, area: currentArea })
                });
                await fetchData(true);
                Toast.fire({ icon: 'success', title: 'បានសម្រាកជោគជ័យ' });
            } catch (e) { Toast.fire({ icon: 'error', title: 'Connection Failed' }); }
        }

        async function submitTimeIn(id, name) {
            try {
                await fetch(`${API_URL}/timein`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: id })
                });
                await fetchData(true);
                Toast.fire({ icon: 'success', title: 'ស្វាគមន៍ត្រឡប់មកវិញ' });
            } catch (e) { Toast.fire({ icon: 'error', title: 'Connection Failed' }); }
        }

        function confirmTimeIn(id, name) {
            const card = document.getElementById(`break-card-${id}`);
            if(card) {
                card.style.transform = "scale(0.8) translateY(-20px)";
                card.style.opacity = "0";
            }
            setTimeout(() => submitTimeIn(id, name), 200);
        }

        document.getElementById('searchBar').addEventListener('input', () => updateUI(false));
        
        loadData();
    </script>
</body>
</html>
