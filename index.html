<!DOCTYPE html>
<html lang="km" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Staff Hub - Onyx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Khmer:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Outfit"', 'sans-serif'],
                        khmer: ['"Noto Sans Khmer"', 'sans-serif']
                    },
                    colors: {
                        onyx: '#09090b',
                        surface: '#18181b',
                        cyan: '#22d3ee',
                        rose: '#fb7185',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            
            /* --- COOL STATIC BACKGROUND --- */
            background-image: 
                /* Subtle Noise Texture */
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E"),
                /* Deep Mesh Gradients */
                radial-gradient(at 0% 0%, rgba(34, 211, 238, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(244, 63, 94, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            background-size: cover;
        }

        /* --- GLASS COMPONENTS --- */
        .glass-panel {
            background: rgba(20, 20, 24, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* --- CARD DESIGN --- */
        .card-onyx {
            position: relative;
            background: rgba(30, 30, 35, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateZ(0);
        }

        .card-onyx:hover {
            transform: translateY(-4px);
            background: rgba(40, 40, 45, 0.6);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        /* Hover Glow Effect */
        .card-onyx.cyan:hover { border-color: rgba(34, 211, 238, 0.4); box-shadow: 0 10px 40px -10px rgba(34, 211, 238, 0.15); }
        .card-onyx.rose:hover { border-color: rgba(251, 113, 133, 0.4); box-shadow: 0 10px 40px -10px rgba(251, 113, 133, 0.15); }

        /* --- SEARCH INPUT --- */
        .search-box {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .search-box:focus-within {
            background: rgba(10, 10, 10, 0.9);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
        }

        /* --- MOBILE DOCK --- */
        .mobile-dock {
            background: rgba(20, 20, 24, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            box-shadow: 0 20px 40px -5px rgba(0,0,0,0.5);
        }

        /* --- UTILS --- */
        .tab-indicator { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #scroll-sentinel { height: 20px; width: 100%; opacity: 0; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* SweetAlert */
        div:where(.swal2-container) div:where(.swal2-popup) {
            background: #18181b !important;
            border: 1px solid #333;
            border-radius: 24px;
        }
        .swal2-title { color: #fff !important; font-family: 'Noto Sans Khmer', sans-serif !important; }
        .swal2-html-container { color: #a1a1aa !important; }
        .swal2-confirm { background: #fff !important; color: #000 !important; border-radius: 12px !important; font-weight: 700 !important; }
        .swal2-cancel { background: #27272a !important; color: #fff !important; border-radius: 12px !important; }
    </style>
</head>
<body class="flex flex-col antialiased font-sans text-slate-100">

    <div id="view-selection" class="relative z-50 min-h-screen flex flex-col items-center justify-center p-6 animate-fade-in">
        <div class="w-full max-w-5xl flex flex-col items-center">
            
            <div class="mb-16 text-center">
                <div class="w-24 h-24 rounded-3xl bg-gradient-to-br from-gray-800 to-black border border-white/10 shadow-2xl flex items-center justify-center mb-8 mx-auto">
                    <i data-lucide="layers" class="w-12 h-12 text-white"></i>
                </div>
                <h1 class="text-6xl md:text-8xl font-black tracking-tight text-white mb-4">Staff Hub</h1>
                <p class="text-slate-400 font-khmer text-xl font-medium tracking-wide">Select Workspace</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl px-4">
                <button onclick="enterArea('A')" class="card-onyx cyan group p-1 h-52 text-left relative">
                    <div class="relative z-10 p-8 flex flex-col justify-between h-full">
                        <div class="w-14 h-14 rounded-2xl border border-cyan-500/20 flex items-center justify-center text-2xl font-black text-cyan-400 bg-cyan-500/5 group-hover:bg-cyan-500 group-hover:text-black transition-all duration-300">A</div>
                        <div>
                            <h2 class="text-3xl font-bold text-white font-khmer mb-1">តំបន់ A</h2>
                            <p class="text-cyan-400 text-xs font-bold tracking-widest uppercase opacity-60 group-hover:opacity-100 transition-opacity">Canteen</p>
                        </div>
                    </div>
                </button>

                <button onclick="enterArea('B')" class="card-onyx rose group p-1 h-52 text-left relative">
                    <div class="relative z-10 p-8 flex flex-col justify-between h-full">
                        <div class="w-14 h-14 rounded-2xl border border-rose-500/20 flex items-center justify-center text-2xl font-black text-rose-400 bg-rose-500/5 group-hover:bg-rose-500 group-hover:text-black transition-all duration-300">B</div>
                        <div>
                            <h2 class="text-3xl font-bold text-white font-khmer mb-1">តំបន់ B</h2>
                            <p class="text-rose-400 text-xs font-bold tracking-widest uppercase opacity-60 group-hover:opacity-100 transition-opacity">Garden</p>
                        </div>
                    </div>
                </button>
            </div>
            
            <div id="loader-initial" class="mt-16 h-8 w-8"></div>
        </div>
    </div>

    <div id="view-dashboard" class="relative z-40 hidden flex-col min-h-screen">
        
        <header class="sticky top-4 z-50 w-full px-4">
            <div class="glass-panel rounded-2xl px-6 py-3 max-w-[1600px] mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                
                <div class="flex items-center gap-6 w-full md:w-auto">
                    <button onclick="goBack()" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center transition-all text-slate-400 hover:text-white border border-white/5">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                    <div class="flex flex-col">
                        <h1 class="font-bold text-lg text-white leading-none">Staff Hub</h1>
                        <span id="displayAreaBadge" class="text-[10px] font-bold tracking-widest text-cyan-400 uppercase mt-0.5">AREA A</span>
                    </div>
                </div>

                <div class="hidden md:flex bg-black/40 p-1 rounded-xl border border-white/10 relative w-80">
                    <div id="desktop-tab-bg" class="tab-indicator w-1/2 h-[calc(100%-8px)] absolute top-1 left-1 bg-white rounded-lg shadow-lg z-0"></div>
                    <button onclick="switchTab('staff')" id="tab-staff-desktop" class="relative z-10 w-1/2 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 font-khmer transition-colors text-black">
                        <i data-lucide="search" class="w-4 h-4"></i> ស្វែងរក
                    </button>
                    <button onclick="switchTab('active')" id="tab-active-desktop" class="relative z-10 w-1/2 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 font-khmer transition-colors text-slate-400 hover:text-white">
                        <i data-lucide="clock" class="w-4 h-4"></i> កំពុងសម្រាក
                    </button>
                </div>

                <div id="searchContainer" class="relative w-full md:w-80 search-box rounded-xl">
                    <i data-lucide="search" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="text" id="searchBar" class="w-full bg-transparent border-none rounded-xl py-2.5 pl-12 pr-10 text-white placeholder-slate-500 focus:outline-none focus:ring-0 font-khmer text-sm" placeholder="Search ID or Name...">
                    <div id="search-spinner" class="hidden absolute right-4 top-1/2 -translate-y-1/2">
                        <i data-lucide="loader-2" class="w-4 h-4 text-cyan-400 animate-spin"></i>
                    </div>
                </div>

            </div>
        </header>

        <main class="flex-grow px-4 pt-8 pb-40 md:pb-12 max-w-[1600px] mx-auto w-full">
            
            <div id="container-staff">
                <div id="staff-start-search" class="flex flex-col items-center justify-center py-32 md:py-48 text-center animate-fade-in">
                    <div class="w-20 h-20 bg-white/5 rounded-3xl flex items-center justify-center mb-6 border border-white/5 shadow-2xl">
                        <i data-lucide="search-code" class="w-10 h-10 text-slate-400"></i>
                    </div>
                    <h3 class="text-3xl font-bold text-white mb-3 font-khmer">ស្វែងរកបុគ្គលិក</h3>
                    <p class="text-slate-500 text-sm font-khmer max-w-xs mx-auto">Please input Staff ID or Name.</p>
                </div>

                <div id="staff-no-results" class="hidden flex flex-col items-center justify-center py-24 text-center">
                    <p class="text-slate-500 font-khmer text-lg">No Results Found</p>
                </div>

                <div id="staffGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6"></div>
                
                <div id="scroll-sentinel" class="mt-8 flex justify-center">
                    <div id="scroll-loader" class="hidden w-8 h-8 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
                </div>
            </div>

            <div id="container-active" class="hidden">
                <div class="flex items-center justify-between mb-8 px-2">
                    <div class="flex items-center gap-3">
                        <div id="active-indicator" class="w-1 h-6 bg-cyan-400 rounded-full"></div>
                        <h2 class="text-xl font-bold text-white font-khmer">បុគ្គលិកកំពុងសម្រាក</h2>
                    </div>
                    <div id="active-badge" class="px-3 py-1 rounded-lg bg-white/5 border border-white/10 text-xs text-white font-mono font-bold">
                        <span id="itemCount">0</span> ACTIVE
                    </div>
                </div>

                <div id="no-active" class="hidden flex flex-col items-center justify-center py-32 text-center opacity-40">
                    <i data-lucide="coffee" class="w-12 h-12 text-slate-500 mb-4"></i>
                    <p class="text-slate-500 font-khmer text-lg">System Idle</p>
                </div>
                <div id="activeGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6"></div>
            </div>

        </main>

        <nav class="md:hidden fixed bottom-8 left-1/2 -translate-x-1/2 z-[60] w-auto pointer-events-auto">
            <div class="mobile-dock px-6 py-3 flex items-center gap-8">
                <button onclick="switchTab('staff')" id="tab-staff-mobile" class="flex flex-col items-center gap-1 group transition-all text-white">
                    <i data-lucide="search" class="w-6 h-6 transition-transform group-active:scale-90"></i>
                    <span class="text-[10px] font-bold font-khmer">ស្វែងរក</span>
                    <div id="mobile-dot-staff" class="w-1 h-1 bg-white rounded-full mt-1 opacity-100 transition-opacity tab-dot"></div>
                </button>
                
                <button onclick="switchTab('active')" id="tab-active-mobile" class="flex flex-col items-center gap-1 group transition-all text-slate-500">
                    <i data-lucide="coffee" class="w-6 h-6 transition-transform group-active:scale-90"></i>
                    <span class="text-[10px] font-bold font-khmer">សម្រាក</span>
                    <div id="mobile-dot-active" class="w-1 h-1 bg-white rounded-full mt-1 opacity-0 transition-opacity tab-dot"></div>
                </button>
            </div>
        </nav>

    </div>

    <script>
        const API_URL = "https://attendance-break-di.onrender.com";
        
        let allStaff = [];
        let activeBreaks = [];
        let currentFilteredStaff = [];
        let currentArea = null;
        let currentTab = 'staff';
        
        let currentPage = 1;
        const itemsPerPage = 20;
        
        let refreshTimer = null;
        let minuteTimer = null;
        let staffCacheData = [];
        let searchTimeout = null;

        // --- INFINITE SCROLL OBSERVER ---
        const scrollObserver = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && currentTab === 'staff') {
                if (currentFilteredStaff.length > currentPage * itemsPerPage) {
                    document.getElementById('scroll-loader').classList.remove('hidden');
                    setTimeout(() => { 
                        currentPage++;
                        renderNextBatch();
                        document.getElementById('scroll-loader').classList.add('hidden');
                    }, 300);
                }
            }
        }, { threshold: 0.1 });

        // --- DATA LOGIC ---
        async function loadData() {
            try {
                document.getElementById('loader-initial').innerHTML = '<div class="w-10 h-10 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>';
                lucide.createIcons();
                const staffRes = await fetch(`${API_URL}/staff`);
                if(staffRes.ok) staffCacheData = await staffRes.json();
                await fetchData(true);
                refreshTimer = setInterval(() => fetchData(false), 5000);
                minuteTimer = setInterval(() => updateTimeDisplays(), 1000);
                document.getElementById('loader-initial').innerHTML = '';
            } catch (err) {
                document.getElementById('loader-initial').innerHTML = '<span class="text-rose-500 font-bold text-xs tracking-widest">OFFLINE</span>';
            }
        }

        async function fetchData(isInitial = false) {
            try {
                const [resStaff, resBreaks] = await Promise.all([
                    fetch(`${API_URL}/staff`),
                    fetch(`${API_URL}/active-breaks`)
                ]);
                allStaff = await resStaff.json();
                activeBreaks = await resBreaks.json();

                if (!document.activeElement || document.activeElement.id !== 'searchBar') {
                    if (currentTab === 'active') updateUI(false);
                    if (isInitial && currentTab === 'staff') updateUI(false);
                }
            } catch (e) { console.error("Sync Error", e); }
        }

        document.getElementById('searchBar').addEventListener('input', (e) => {
            const spinner = document.getElementById('search-spinner');
            spinner.classList.remove('hidden');
            
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                updateUI(true); 
                spinner.classList.add('hidden');
            }, 300);
        });

        function updateUI(fromSearch = false) {
            const searchTerm = document.getElementById('searchBar').value.toLowerCase().trim();

            if (currentTab === 'staff') {
                const startSearch = document.getElementById('staff-start-search');
                const noResults = document.getElementById('staff-no-results');
                const grid = document.getElementById('staffGrid');
                const sentinel = document.getElementById('scroll-sentinel');

                if (searchTerm.length === 0) {
                    startSearch.classList.remove('hidden');
                    noResults.classList.add('hidden');
                    grid.innerHTML = ''; 
                    sentinel.classList.add('hidden');
                    return;
                }

                startSearch.classList.add('hidden');

                currentFilteredStaff = allStaff.filter(p => 
                    (p.name_kh && p.name_kh.toLowerCase().includes(searchTerm)) || 
                    (p.name_en && p.name_en.toLowerCase().includes(searchTerm)) || 
                    (p.id && p.id.toString().includes(searchTerm))
                );

                currentPage = 1;
                grid.innerHTML = ''; 
                
                if (currentFilteredStaff.length === 0) {
                    noResults.classList.remove('hidden');
                    sentinel.classList.add('hidden');
                } else {
                    noResults.classList.add('hidden');
                    renderNextBatch();
                    sentinel.classList.remove('hidden');
                    scrollObserver.observe(sentinel);
                }

            } else if (currentTab === 'active') {
                let filtered = activeBreaks;
                if (searchTerm.length > 0) {
                    filtered = activeBreaks.filter(item => {
                        const staffInfo = staffCacheData.find(s => s.id == item.id);
                        const nameEn = staffInfo ? staffInfo.name_en.toLowerCase() : "";
                        const nameKh = staffInfo ? (staffInfo.name_kh || "").toLowerCase() : "";
                        const nameRaw = item.name.toLowerCase();
                        const id = String(item.id);
                        return nameEn.includes(searchTerm) || nameKh.includes(searchTerm) || nameRaw.includes(searchTerm) || id.includes(searchTerm);
                    });
                }
                renderActiveBreaks(filtered);
            }
        }

        function renderNextBatch() {
            const grid = document.getElementById('staffGrid');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, currentFilteredStaff.length);
            const batch = currentFilteredStaff.slice(startIndex, endIndex);

            batch.forEach((person, index) => {
                const breakData = activeBreaks.find(b => b.id == person.id && !b.timeIn);
                const isOnBreak = !!breakData;
                
                // Color logic based on Area
                const activeColorClass = currentArea === 'A' ? 'cyan' : 'rose';
                const borderColor = isOnBreak ? 'border-white/5' : (currentArea === 'A' ? 'hover:border-cyan-500/40' : 'hover:border-rose-500/40');

                let btnText = isOnBreak ? (breakData.area !== currentArea ? `នៅ Zone ${breakData.area}` : "កំពុងសម្រាក") : "ចេញសម្រាក";
                const imgUrl = person.image || `https://ui-avatars.com/api/?background=random&color=fff&name=${encodeURIComponent(person.name_en)}`;
                
                const card = document.createElement('div');
                card.className = `card-onyx p-5 flex flex-col items-center group animate-fade-in ${borderColor} ${activeColorClass}`;
                if(isOnBreak) card.classList.add('opacity-60', 'grayscale');

                card.innerHTML = `
                    <div class="w-full flex flex-col items-center">
                        <div class="absolute top-0 left-0 px-2 py-1 bg-black/40 rounded-br-xl text-[9px] text-slate-400 font-mono border-r border-b border-white/5 tracking-widest">#${person.id}</div>
                        
                        <div class="relative mb-3 mt-3">
                            <img src="${imgUrl}" class="w-16 h-16 rounded-full object-cover border-2 border-white/10 bg-black relative z-10 shadow-xl group-hover:scale-105 transition-transform">
                            ${!isOnBreak ? `<div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-black rounded-full z-20"></div>` : ''}
                        </div>

                        <div class="text-center w-full mb-4">
                            <h3 class="font-bold text-white text-sm truncate font-khmer leading-snug">${person.name_kh || person.name_en}</h3>
                            <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mt-1">${person.group || 'Staff'}</p>
                        </div>

                        <button ${isOnBreak ? 'disabled' : ''} onclick='confirmStartBreak(${JSON.stringify(person).replace(/'/g, "&#39;")})' 
                            class="w-full py-2.5 rounded-xl font-bold text-xs transition-all active:scale-95 flex items-center justify-center gap-2 font-khmer border border-white/10 hover:bg-white hover:text-black hover:border-white text-slate-300">
                            ${isOnBreak ? '<i data-lucide="coffee" class="w-3.5 h-3.5"></i>' : '<i data-lucide="log-out" class="w-3.5 h-3.5"></i>'} ${btnText}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function renderActiveBreaks(list) {
            const grid = document.getElementById('activeGrid');
            const emptyMsg = document.getElementById('no-active');
            
            const filteredList = list.filter(item => String(item.area).trim() === String(currentArea).trim());
            document.getElementById('itemCount').innerText = filteredList.length;

            if (filteredList.length === 0) {
                grid.innerHTML = '';
                return emptyMsg.classList.remove('hidden');
            }
            emptyMsg.classList.add('hidden');

            const newIds = new Set(filteredList.map(i => i.id));
            Array.from(grid.children).forEach(card => {
                if (!newIds.has(card.dataset.id)) card.remove();
            });

            filteredList.forEach((item) => {
                let card = document.getElementById(`break-card-${item.id}`);
                if (!card) {
                    const staffInfo = staffCacheData.find(s => s.id == item.id);
                    const khName = staffInfo ? (staffInfo.name_kh || staffInfo.name_en) : item.name;
                    const imgUrl = item.image || (staffInfo ? staffInfo.image : `https://ui-avatars.com/api/?background=random&name=${encodeURIComponent(item.name)}`);
                    
                    card = document.createElement('div');
                    card.id = `break-card-${item.id}`;
                    card.dataset.id = item.id;
                    card.className = "card-onyx p-5 flex flex-col items-center relative animate-fade-in";
                    
                    card.innerHTML = `
                        <div class="w-full">
                            <div class="flex items-center w-full gap-4 mb-4">
                                <img src="${imgUrl}" class="w-12 h-12 rounded-full object-cover border border-white/10 bg-black shadow-md">
                                <div class="flex-1 min-w-0">
                                    <h3 class="font-bold text-white text-sm truncate font-khmer">${khName}</h3>
                                    <div class="flex items-center gap-1.5 text-[10px] text-slate-400 mt-0.5">
                                        <i data-lucide="clock" class="w-3 h-3 text-cyan-400"></i>
                                        <span>${item.timeOut}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-black/40 rounded-xl p-3 w-full mb-4 border border-white/5 flex items-end justify-between px-4">
                                <div>
                                    <p class="text-[9px] text-slate-500 font-bold tracking-widest uppercase">MINS</p>
                                </div>
                                <p id="time-val-${item.id}" class="text-4xl font-black text-white font-mono leading-none tracking-tighter">00</p>
                            </div>
                            <button onclick="confirmTimeIn('${item.id}', '${khName}')" 
                                class="w-full bg-white/5 hover:bg-emerald-500 hover:text-black text-emerald-400 border border-emerald-500/30 hover:border-transparent py-3 rounded-xl font-bold text-xs transition-all active:scale-95 flex items-center justify-center gap-2 group font-khmer">
                                <span class="group-hover:hidden flex items-center gap-2"><i data-lucide="log-in" class="w-3.5 h-3.5"></i> ចូលធ្វើការ</span>
                                <span class="hidden group-hover:flex items-center gap-2"><i data-lucide="check" class="w-3.5 h-3.5"></i> បញ្ជាក់</span>
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                }
                card.dataset.timeout = item.timeOut;
            });
            lucide.createIcons();
        }

        function updateTimeDisplays() {
            if (currentTab !== 'active') return;
            document.querySelectorAll('[id^="break-card-"]').forEach(card => {
                const timeOut = card.dataset.timeout;
                const id = card.dataset.id;
                if (!timeOut) return;

                const minsGone = getMinutesDiff(timeOut);
                const isOvertime = minsGone > 15;
                const timeEl = document.getElementById(`time-val-${id}`);

                if (timeEl) {
                    timeEl.innerText = String(minsGone).padStart(2, '0');
                    timeEl.style.color = isOvertime ? '#fb7185' : '#fff'; 
                }
                
                if (isOvertime) card.style.borderColor = 'rgba(251, 113, 133, 0.4)';
                else card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
        }

        function getMinutesDiff(timeStr) {
            const now = new Date();
            const [time, modifier] = timeStr.split(' ');
            let [hours, minutes] = time.split(':');
            hours = parseInt(hours);
            if (hours === 12 && modifier === 'AM') hours = 0;
            if (hours !== 12 && modifier === 'PM') hours += 12;
            const breakTime = new Date();
            breakTime.setHours(hours, parseInt(minutes), 0);
            if (breakTime > now) breakTime.setDate(breakTime.getDate() - 1);
            return Math.floor((now - breakTime) / 60000);
        }

        // --- NAVIGATION ---
        function enterArea(area) {
            if(allStaff.length === 0) return;
            currentArea = area;
            
            document.getElementById('activeGrid').innerHTML = '';
            document.getElementById('staffGrid').innerHTML = '';

            const badge = document.getElementById('displayAreaBadge');
            badge.innerText = `AREA ${area}`;
            badge.className = area === 'A' 
                ? "text-[10px] font-bold tracking-widest text-cyan-400 uppercase mt-0.5"
                : "text-[10px] font-bold tracking-widest text-rose-400 uppercase mt-0.5";

            document.getElementById('view-selection').classList.add('hidden');
            const dashboard = document.getElementById('view-dashboard');
            dashboard.classList.remove('hidden');
            dashboard.classList.add('flex');
            
            switchTab('staff');
        }

        function goBack() {
            currentArea = null;
            document.getElementById('searchBar').value = '';
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('flex');
            document.getElementById('view-selection').classList.remove('hidden');
        }

        function switchTab(tab) {
            currentTab = tab;
            const bg = document.getElementById('desktop-tab-bg');
            const btnStaff = document.getElementById('tab-staff-desktop');
            const btnActive = document.getElementById('tab-active-desktop');
            const mStaff = document.getElementById('tab-staff-mobile');
            const mActive = document.getElementById('tab-active-mobile');

            if (tab === 'staff') {
                if(bg) bg.style.transform = 'translateX(0)';
                if(btnStaff) { btnStaff.classList.remove('text-slate-400', 'hover:text-white'); btnStaff.classList.add('text-black'); }
                if(btnActive) { btnActive.classList.add('text-slate-400', 'hover:text-white'); btnActive.classList.remove('text-black'); }

                if(mStaff) {
                    mStaff.classList.remove('text-slate-500'); mStaff.classList.add('text-white');
                    const dot = document.getElementById('mobile-dot-staff');
                    if(dot) { dot.classList.remove('opacity-0'); dot.classList.add('opacity-100'); }
                }
                if(mActive) {
                    mActive.classList.add('text-slate-500'); mActive.classList.remove('text-white');
                    const dot = document.getElementById('mobile-dot-active');
                    if(dot) { dot.classList.remove('opacity-100'); dot.classList.add('opacity-0'); }
                }

                document.getElementById('container-staff').classList.remove('hidden');
                document.getElementById('container-active').classList.add('hidden');
                updateUI();
            } else {
                if(bg) bg.style.transform = 'translateX(100%)';
                if(btnStaff) { btnStaff.classList.add('text-slate-400', 'hover:text-white'); btnStaff.classList.remove('text-black'); }
                if(btnActive) { btnActive.classList.remove('text-slate-400', 'hover:text-white'); btnActive.classList.add('text-black'); }

                if(mStaff) {
                    mStaff.classList.add('text-slate-500'); mStaff.classList.remove('text-white');
                    const dot = document.getElementById('mobile-dot-staff');
                    if(dot) { dot.classList.remove('opacity-100'); dot.classList.add('opacity-0'); }
                }
                if(mActive) {
                    mActive.classList.remove('text-slate-500'); mActive.classList.add('text-white');
                    const dot = document.getElementById('mobile-dot-active');
                    if(dot) { dot.classList.remove('opacity-0'); dot.classList.add('opacity-100'); }
                }

                document.getElementById('container-staff').classList.add('hidden');
                document.getElementById('container-active').classList.remove('hidden');
                updateUI();
            }
        }

        // --- ALERTS ---
        const toastConfig = Swal.mixin({
            toast: true,
            position: 'bottom-end',
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            background: '#18181b',
            color: '#fff',
            customClass: { popup: 'border border-white/10 rounded-xl' }
        });

        function confirmStartBreak(person) {
            const color = currentArea === 'A' ? '#22d3ee' : '#fb7185'; 
            Swal.fire({
                title: 'Start Break?',
                html: `<h3 class="text-xl font-bold text-white font-khmer mt-2">${person.name_kh || person.name_en}</h3>`,
                showCancelButton: true,
                confirmButtonText: 'OK',
                cancelButtonText: 'Cancel',
                confirmButtonColor: '#fff',
                background: '#18181b'
            }).then((result) => {
                if (result.isConfirmed) submitBreak(person);
            });
        }

        function confirmTimeIn(id, name) {
            Swal.fire({
                title: 'Back to Work?',
                text: name,
                showCancelButton: true,
                confirmButtonText: 'OK',
                confirmButtonColor: '#22d3ee',
                background: '#18181b'
            }).then((result) => {
                if(result.isConfirmed) {
                    const card = document.getElementById(`break-card-${id}`);
                    if(card) {
                        card.style.transform = "scale(0.9) translateY(-10px)";
                        card.style.opacity = "0";
                    }
                    setTimeout(() => submitTimeIn(id, name), 300);
                }
            });
        }

        async function submitBreak(person) {
            try {
                await fetch(`${API_URL}/break`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: person.id, name: person.name_kh || person.name_en, group: person.group, area: currentArea })
                });
                await fetchData(true);
                toastConfig.fire({ icon: 'success', title: 'Success' });
                document.getElementById('searchBar').value = '';
                updateUI();
            } catch (e) { toastConfig.fire({ icon: 'error', title: 'Error' }); }
        }

        async function submitTimeIn(id, name) {
            try {
                await fetch(`${API_URL}/timein`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: id })
                });
                await fetchData(true);
                toastConfig.fire({ icon: 'success', title: 'Welcome Back' });
            } catch (e) { toastConfig.fire({ icon: 'error', title: 'Error' }); }
        }
        
        loadData();
    </script>
</body>
</html>
