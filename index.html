<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Staff Hub Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Inter"', 'sans-serif'] },
                    animation: { 
                        'blob': 'blob 7s infinite',
                        'fade-in-up': 'fadeInUp 0.4s ease-out forwards',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '1', boxShadow: '0 0 0 0px rgba(244, 63, 94, 0.6)' },
                            '50%': { opacity: '.9', boxShadow: '0 0 0 10px rgba(244, 63, 94, 0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            background-image: 
                radial-gradient(at 40% 20%, hsla(266,51%,46%,0.2) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189,100%,56%,0.2) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(340,100%,76%,0.2) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .glass-header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        
        .active-tab { background: white; color: #0f172a; box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2); }
        .inactive-tab { background: transparent; color: #94a3b8; }
        
        div:where(.swal2-container) div:where(.swal2-popup) {
            background: rgba(30, 41, 59, 0.95) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: white;
        }
    </style>
</head>
<body class="flex flex-col antialiased">

    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="absolute top-0 -left-4 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
        <div class="absolute top-0 -right-4 w-72 h-72 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob" style="animation-delay: 2s"></div>
        <div class="absolute -bottom-8 left-20 w-72 h-72 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob" style="animation-delay: 4s"></div>
    </div>

    <div id="view-selection" class="relative z-50 min-h-screen flex flex-col items-center justify-center p-6">
        <div class="glass-card p-10 rounded-[32px] shadow-2xl max-w-md w-full text-center animate-fade-in-up border-t border-white/20">
            <div class="w-16 h-16 bg-gradient-to-tr from-blue-500 to-purple-500 rounded-2xl mx-auto flex items-center justify-center mb-6 shadow-lg shadow-blue-500/30">
                <i data-lucide="scan-face" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white mb-2 tracking-tight">Staff Portal</h1>
            <p class="text-slate-400 mb-8 font-medium">Select your current zone</p>
            
            <div class="flex flex-col gap-4">
                <button onclick="enterArea('A')" class="group relative overflow-hidden rounded-2xl bg-slate-800/50 p-1 hover:bg-blue-500/10 transition-all duration-300 border border-slate-700 hover:border-blue-500">
                    <div class="flex items-center p-4">
                        <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-xl font-bold text-white shadow-lg shadow-blue-500/30">A</div>
                        <div class="text-left ml-4 flex-1">
                            <h2 class="text-lg font-bold text-white">Zone A</h2>
                            <span class="text-xs font-semibold text-blue-400 uppercase tracking-widest">Lounge / Canteen</span>
                        </div>
                        <i data-lucide="arrow-right" class="text-slate-500 group-hover:text-blue-400 transition-transform group-hover:translate-x-1"></i>
                    </div>
                </button>
                <button onclick="enterArea('B')" class="group relative overflow-hidden rounded-2xl bg-slate-800/50 p-1 hover:bg-rose-500/10 transition-all duration-300 border border-slate-700 hover:border-rose-500">
                    <div class="flex items-center p-4">
                        <div class="w-12 h-12 bg-rose-600 rounded-xl flex items-center justify-center text-xl font-bold text-white shadow-lg shadow-rose-500/30">B</div>
                        <div class="text-left ml-4 flex-1">
                            <h2 class="text-lg font-bold text-white">Zone B</h2>
                            <span class="text-xs font-semibold text-rose-400 uppercase tracking-widest">Garden / Outside</span>
                        </div>
                        <i data-lucide="arrow-right" class="text-slate-500 group-hover:text-rose-400 transition-transform group-hover:translate-x-1"></i>
                    </div>
                </button>
            </div>
            <div id="loader-initial" class="mt-8 text-xs font-bold text-slate-500 uppercase tracking-widest flex justify-center items-center gap-2">
                <i data-lucide="loader" class="animate-spin w-3 h-3"></i> Connecting...
            </div>
        </div>
    </div>

    <div id="view-dashboard" class="relative z-40 hidden flex-col min-h-screen">
        
        <header class="glass-header sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <button onclick="goBack()" class="w-10 h-10 flex items-center justify-center bg-slate-800/50 hover:bg-slate-700 rounded-full transition text-slate-300 border border-white/10">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        </button>
                        <div>
                            <h1 class="font-bold text-lg text-white leading-none">Dashboard</h1>
                            <div class="flex items-center gap-2 mt-1">
                                <span id="displayArea" class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-600/20 text-blue-400 border border-blue-500/30">--</span>
                                <span class="text-[10px] font-bold text-slate-400">Active: <span id="itemCount" class="text-white">0</span></span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="relative w-32 md:w-64">
                        <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-500"></i>
                        <input type="text" id="searchBar" class="w-full bg-slate-800/50 focus:bg-slate-800 border border-white/10 focus:border-blue-500 rounded-xl py-2 pl-9 pr-3 text-sm text-white placeholder-slate-500 outline-none transition-all" placeholder="Search...">
                    </div>
                </div>

                <div class="bg-slate-800/50 p-1 rounded-xl flex w-full border border-white/5">
                    <button onclick="switchTab('staff')" id="tab-staff" class="active-tab flex-1 py-2 rounded-lg text-xs font-bold transition-all flex justify-center items-center gap-2">
                        <i data-lucide="users" class="w-4 h-4"></i> Take Break
                    </button>
                    <button onclick="switchTab('active')" id="tab-active" class="inactive-tab flex-1 py-2 rounded-lg text-xs font-bold transition-all flex justify-center items-center gap-2">
                        <i data-lucide="coffee" class="w-4 h-4"></i> On Break
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-grow p-4 pb-24">
            <div class="max-w-7xl mx-auto">
                
                <div id="container-staff" class="animate-fade-in-up">
                    <div id="staff-placeholder" class="flex flex-col items-center justify-center py-20 text-center opacity-60">
                        <div class="bg-white/5 p-6 rounded-full mb-4">
                            <i data-lucide="search" class="w-12 h-12 text-slate-400"></i>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-1">Search to Find Staff</h3>
                        <p class="text-slate-400 text-sm">Type a name or ID to start a break</p>
                    </div>

                    <div id="staff-not-found" class="hidden flex flex-col items-center justify-center py-20 text-center opacity-60">
                        <div class="bg-rose-500/10 p-6 rounded-full mb-4">
                            <i data-lucide="user-x" class="w-12 h-12 text-rose-400"></i>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-1">No Staff Found</h3>
                        <p class="text-slate-400 text-sm">Try a different name or ID</p>
                    </div>

                    <div id="staffGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"></div>
                </div>

                <div id="container-active" class="hidden animate-fade-in-up">
                    <div id="activeGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"></div>
                    <div id="no-active" class="hidden flex flex-col items-center justify-center py-20 opacity-50">
                        <i data-lucide="coffee" class="w-12 h-12 text-slate-500 mb-2"></i>
                        <p class="text-slate-400 text-sm">Everyone is working</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        const API_URL = "https://attendance-break-di.onrender.com";

        // --- GLOBAL STATE ---
        let allStaff = [];
        let activeBreaks = [];
        let currentArea = null;
        let currentTab = 'staff';
        let pollingTimer = null; 
        let minuteTimer = null;

        const Toast = Swal.mixin({
            toast: true,
            position: 'bottom-end',
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            didOpen: (toast) => {
                toast.addEventListener('mouseenter', Swal.stopTimer)
                toast.addEventListener('mouseleave', Swal.resumeTimer)
            }
        });

        lucide.createIcons();

        // --- DATA LOADING ---
        async function loadData() {
            try {
                // Initial Load (With Animation)
                await fetchData(true);
                document.getElementById('loader-initial').innerHTML = '<span class="text-emerald-400 font-bold flex items-center gap-2"><i data-lucide="wifi" class="w-3 h-3"></i> Online</span>';
                lucide.createIcons();
                
                // Real-Time Polling (Background - No Animation)
                pollingTimer = setInterval(() => fetchData(false), 2000); 

                // Local Minute Update (Every 5 seconds - updates numbers purely visually)
                minuteTimer = setInterval(() => updateTimeDisplays(), 5000);

            } catch (err) {
                document.getElementById('loader-initial').innerHTML = '<span class="text-rose-500 font-bold">Offline</span>';
            }
        }

        // Fetch Data: isBackground = true means NO animation
        async function fetchData(isInitial = false) {
            try {
                const [resStaff, resBreaks] = await Promise.all([
                    fetch(`${API_URL}/staff`),
                    fetch(`${API_URL}/active-breaks`)
                ]);
                
                const newStaff = await resStaff.json();
                const newBreaks = await resBreaks.json();

                // Simple check to prevent unnecessary DOM manipulation if nothing changed
                if(JSON.stringify(newBreaks) !== JSON.stringify(activeBreaks) || isInitial) {
                    allStaff = newStaff;
                    activeBreaks = newBreaks;
                    updateUI(!isInitial); // Pass true to Disable Animation if it's a background update
                }
            } catch (e) { console.error("Poll Error", e); }
        }

        // --- UI UPDATER ---
        function updateUI(disableAnimation = false) {
            if (currentTab === 'active') {
                renderActiveBreaks(activeBreaks, disableAnimation);
            } else if (currentTab === 'staff') {
                const searchTerm = document.getElementById('searchBar').value.toLowerCase();
                if (searchTerm.length > 0) {
                    const filtered = allStaff.filter(p => p.name_en.toLowerCase().includes(searchTerm) || (p.id && p.id.toString().includes(searchTerm)));
                    renderStaff(filtered, disableAnimation);
                }
            }
        }

        // --- SMART RENDER (DIFFING) ---
        
        function renderActiveBreaks(list, disableAnimation) {
            const grid = document.getElementById('activeGrid');
            const emptyMsg = document.getElementById('no-active');
            
            // [FIXED] Show all active breaks, do NOT filter by area
            const filteredList = list; 
            document.getElementById('itemCount').innerText = filteredList.length;

            if (filteredList.length === 0) {
                grid.innerHTML = '';
                emptyMsg.classList.remove('hidden');
                return;
            } else {
                emptyMsg.classList.add('hidden');
            }

            // 1. Mark existing cards
            const currentIds = new Set(filteredList.map(i => i.id));
            
            // 2. Remove old cards
            Array.from(grid.children).forEach(card => {
                if (!currentIds.has(card.dataset.id)) {
                    card.remove();
                }
            });

            // 3. Update or Create
            filteredList.forEach((item) => {
                const existingCard = document.getElementById(`break-card-${item.id}`);
                const staffInfo = allStaff.find(s => s.id == item.id);
                const imgUrl = staffInfo ? staffInfo.image : `https://ui-avatars.com/api/?background=random&name=${encodeURIComponent(item.name)}`;
                const minsGone = getMinutesDiff(item.timeOut);
                const isOvertime = minsGone > 15;
                const overtimeAmount = minsGone - 15;

                // Prepare Visual States
                const borderClass = isOvertime ? "border-rose-500/50 shadow-rose-900/20 shadow-lg animate-pulse-glow bg-rose-900/10" : "border-white/10";
                const timeColor = isOvertime ? "text-rose-400" : "text-slate-200";
                const statusHtml = isOvertime
                    ? `<span class="absolute top-2 right-2 bg-rose-600 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-sm">+${overtimeAmount}m</span>`
                    : `<span class="absolute top-2 right-2 bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-sm">OK</span>`;
                
                // Show area badge if it differs from current view area
                const areaBadge = (item.area !== currentArea) 
                    ? `<span class="absolute top-2 left-2 bg-slate-700 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded border border-white/10">ZONE ${item.area || '?'}</span>` 
                    : '';

                if (existingCard) {
                    // --- SMART UPDATE (No Flicker) ---
                    // Only update inner parts if they changed
                    const timeEl = document.getElementById(`time-val-${item.id}`);
                    const badgeContainer = document.getElementById(`badge-container-${item.id}`);
                    
                    if(timeEl) {
                        timeEl.innerHTML = `${minsGone}<span class="text-xs font-bold text-slate-500 ml-0.5">min</span>`;
                        timeEl.className = `text-xl font-black ${timeColor} leading-none my-0.5`;
                    }
                    if(badgeContainer) badgeContainer.innerHTML = statusHtml;
                    
                    // Update Border state
                    existingCard.className = `glass-card rounded-2xl p-3 flex flex-col items-center text-center relative transition-all border ${borderClass}`;

                } else {
                    // --- CREATE NEW ---
                    const card = document.createElement('div');
                    card.id = `break-card-${item.id}`;
                    card.dataset.id = item.id;
                    card.dataset.timeout = item.timeOut; // Store for local timer
                    let anim = disableAnimation ? "" : "animate-fade-in-up";
                    card.className = `glass-card rounded-2xl p-3 flex flex-col items-center text-center relative transition-all border ${borderClass} ${anim}`;
                    
                    card.innerHTML = `
                        ${areaBadge}
                        <div id="badge-container-${item.id}">${statusHtml}</div>
                        <img src="${imgUrl}" class="w-14 h-14 rounded-full object-cover mb-2 shadow-lg border-2 border-white/10 bg-slate-800 mt-4">
                        <h3 class="font-bold text-white text-sm mb-0.5 leading-tight truncate w-full">${item.name}</h3>
                        <div class="bg-slate-900/50 rounded-lg p-2 mb-2 w-full border border-white/5 mt-1">
                            <p class="text-[9px] text-slate-500 uppercase font-bold tracking-wider">Elapsed</p>
                            <p id="time-val-${item.id}" class="text-xl font-black ${timeColor} leading-none my-0.5">${minsGone}<span class="text-xs font-bold text-slate-500 ml-0.5">min</span></p>
                            <p class="text-[9px] text-slate-400">Out: ${item.timeOut}</p>
                        </div>
                        <button onclick="confirmTimeIn('${item.id}', '${item.name}', ${isOvertime}, ${overtimeAmount})" 
                            class="w-full bg-slate-700 hover:bg-emerald-600 text-white py-2 rounded-xl font-bold text-xs shadow-lg transition-all flex items-center justify-center gap-1.5 active:scale-95 border border-white/5">
                            <i data-lucide="log-in" class="w-3.5 h-3.5"></i> Clock In
                        </button>
                    `;
                    grid.appendChild(card);
                }
            });
            
            if(!disableAnimation) lucide.createIcons();
        }

        // --- CLIENT SIDE TIMER (Updates numbers only) ---
        function updateTimeDisplays() {
            if (currentTab !== 'active') return;
            const cards = document.querySelectorAll('[id^="break-card-"]');
            
            cards.forEach(card => {
                const timeOut = card.dataset.timeout;
                const id = card.dataset.id;
                if (!timeOut) return;

                const minsGone = getMinutesDiff(timeOut);
                const isOvertime = minsGone > 15;
                const overtimeAmount = minsGone - 15;
                const timeColor = isOvertime ? "text-rose-400" : "text-slate-200";
                
                // Update Number
                const timeEl = document.getElementById(`time-val-${id}`);
                if (timeEl) {
                    timeEl.innerHTML = `${minsGone}<span class="text-xs font-bold text-slate-500 ml-0.5">min</span>`;
                    timeEl.className = `text-xl font-black ${timeColor} leading-none my-0.5`;
                }

                // Update Badge if state changed
                const badgeContainer = document.getElementById(`badge-container-${id}`);
                if(badgeContainer) {
                    const statusHtml = isOvertime
                    ? `<span class="absolute top-2 right-2 bg-rose-600 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-sm">+${overtimeAmount}m</span>`
                    : `<span class="absolute top-2 right-2 bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-sm">OK</span>`;
                    badgeContainer.innerHTML = statusHtml;
                }

                // Update Border
                const borderClass = isOvertime ? "border-rose-500/50 shadow-rose-900/20 shadow-lg animate-pulse-glow bg-rose-900/10" : "border-white/10";
                card.className = `glass-card rounded-2xl p-3 flex flex-col items-center text-center relative transition-all border ${borderClass}`;
            });
        }

        function renderStaff(list, disableAnimation) {
            const grid = document.getElementById('staffGrid');
            const placeholder = document.getElementById('staff-placeholder');
            const notFound = document.getElementById('staff-not-found');
            
            grid.innerHTML = '';
            document.getElementById('itemCount').innerText = list.length;

            if (list.length === 0) {
                notFound.classList.remove('hidden');
                placeholder.classList.add('hidden');
                return;
            } else {
                notFound.classList.add('hidden');
                placeholder.classList.add('hidden');
            }

            list.forEach((person) => {
                const isOnBreak = activeBreaks.some(b => b.id == person.id && !b.timeIn);
                let cardClass = "glass-card rounded-2xl p-3 flex flex-col items-center text-center relative transition-all";
                if (!disableAnimation) cardClass += " animate-fade-in-up";

                let btnState = "";
                let btnText = "Break";
                let btnIcon = "coffee";
                let btnColor = currentArea === 'A' ? "bg-blue-600 hover:bg-blue-500" : "bg-rose-600 hover:bg-rose-500";
                
                if(isOnBreak) {
                    cardClass += " opacity-50 bg-slate-900/50 border-slate-700 grayscale"; 
                    btnState = "disabled style='cursor:not-allowed; opacity:0.5;'";
                    btnText = "On Break";
                    btnIcon = "clock";
                    btnColor = "bg-slate-700";
                } else {
                    cardClass += " hover:bg-white/5 hover:scale-[1.02] hover:shadow-xl hover:border-white/20";
                }

                const imgUrl = person.image || `https://ui-avatars.com/api/?background=random&name=${encodeURIComponent(person.name_en)}`;
                const card = document.createElement('div');
                card.className = cardClass;
                card.innerHTML = `
                    ${isOnBreak ? `<div class="absolute top-2 right-2 bg-slate-800 text-slate-300 text-[9px] font-bold px-2 py-0.5 rounded border border-slate-600">BUSY</div>` : ''}
                    <div class="absolute top-2 left-2 px-1.5 py-0.5 bg-white/10 border border-white/5 rounded text-[9px] font-mono text-slate-400 font-bold">#${person.id || '...'}</div>
                    <div class="relative mb-2 mt-1">
                        <img src="${imgUrl}" class="w-16 h-16 rounded-full object-cover shadow-lg border-2 border-white/10 bg-slate-800">
                    </div>
                    <h3 class="font-bold text-white text-sm truncate w-full leading-tight mb-0.5">${person.name_en}</h3>
                    <p class="text-[10px] text-slate-400 font-medium mb-3 uppercase tracking-wide truncate w-full bg-white/5 rounded py-0.5 px-1">${person.group || 'Staff'}</p>
                    <button ${btnState} onclick='confirmStartBreak(${JSON.stringify(person).replace(/'/g, "&#39;")})' 
                        class="w-full ${btnColor} text-white py-2 rounded-xl font-bold text-xs shadow-lg transition-all flex items-center justify-center gap-1.5 active:scale-95">
                        <i data-lucide="${btnIcon}" class="w-3.5 h-3.5"></i> ${btnText}
                    </button>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        // --- TIME CALC ---
        function getMinutesDiff(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
            if (!parts) return 0;
            let hours = parseInt(parts[1], 10);
            const minutes = parseInt(parts[2], 10);
            const modifier = parts[3].toUpperCase();
            if (hours === 12) hours = modifier === 'PM' ? 12 : 0;
            else hours = modifier === 'PM' ? hours + 12 : hours;
            const now = new Date();
            const breakDate = new Date();
            breakDate.setHours(hours, minutes, 0, 0);
            if (breakDate > now) breakDate.setDate(breakDate.getDate() - 1);
            const diffMins = Math.floor((now - breakDate) / 1000 / 60);
            return diffMins > 0 ? diffMins : 0;
        }

        // --- NAVIGATION ---
        function switchTab(tab) {
            currentTab = tab;
            const tabStaff = document.getElementById('tab-staff');
            const tabActive = document.getElementById('tab-active');
            const conStaff = document.getElementById('container-staff');
            const conActive = document.getElementById('container-active');
            const searchBar = document.getElementById('searchBar');

            if (tab === 'staff') {
                tabStaff.className = "active-tab flex-1 py-2 rounded-lg text-xs font-bold transition-all shadow-sm flex justify-center items-center gap-2";
                tabActive.className = "inactive-tab flex-1 py-2 rounded-lg text-xs font-bold transition-all flex justify-center items-center gap-2";
                conStaff.classList.remove('hidden');
                conActive.classList.add('hidden');
                
                searchBar.value = '';
                document.getElementById('staffGrid').innerHTML = '';
                document.getElementById('staff-placeholder').classList.remove('hidden');
                document.getElementById('staff-not-found').classList.add('hidden');
                document.getElementById('itemCount').innerText = "0";

            } else {
                tabStaff.className = "inactive-tab flex-1 py-2 rounded-lg text-xs font-bold transition-all flex justify-center items-center gap-2";
                tabActive.className = "active-tab flex-1 py-2 rounded-lg text-xs font-bold transition-all shadow-sm flex justify-center items-center gap-2";
                conStaff.classList.add('hidden');
                conActive.classList.remove('hidden');
                
                searchBar.value = ''; 
                fetchData(true); 
            }
        }

        function enterArea(area) {
            if(allStaff.length === 0) return Swal.fire({ icon: 'info', title: 'Loading...', toast:true, position:'bottom-end', showConfirmButton:false, timer:1000 });
            currentArea = area;
            document.getElementById('displayArea').innerText = `ZONE ${area}`;
            
            const selection = document.getElementById('view-selection');
            selection.classList.add('opacity-0', 'scale-95', 'transition-all', 'duration-500');
            setTimeout(() => {
                selection.classList.add('hidden');
                const dash = document.getElementById('view-dashboard');
                dash.classList.remove('hidden');
                dash.classList.add('flex');
            }, 300);
            switchTab('staff'); 
        }

        function goBack() {
            currentArea = null;
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('flex');
            const selection = document.getElementById('view-selection');
            selection.classList.remove('hidden', 'opacity-0', 'scale-95');
        }

        // --- ACTIONS ---
        function confirmStartBreak(person) {
            const color = currentArea === 'A' ? '#3b82f6' : '#f43f5e';
            Swal.fire({
                title: 'Start Break?',
                html: `<div class="flex flex-col items-center gap-2 mt-2">
                        <img src="${person.image || 'https://via.placeholder.com/50'}" class="w-16 h-16 rounded-full border-2 border-slate-600 object-cover">
                        <p class="text-white font-bold text-lg">${person.name_en}</p>
                        <p class="text-slate-400 text-sm">Zone <b style="color:${color}">${currentArea}</b></p>
                       </div>`,
                showCancelButton: true,
                confirmButtonText: 'Confirm',
                confirmButtonColor: color,
                background: '#1e293b'
            }).then((result) => {
                if (result.isConfirmed) submitBreak(person);
            });
        }

        async function submitBreak(person) {
            Swal.fire({ title: '', html: '<i data-lucide="loader-2" class="w-10 h-10 animate-spin text-blue-500"></i>', showConfirmButton: false, background: 'transparent', didOpen: () => lucide.createIcons() });
            try {
                const res = await fetch(`${API_URL}/break`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: person.id, name: person.name_en, group: person.group, area: currentArea })
                });
                if(res.ok) {
                    await fetchData(true);
                    Swal.close();
                    Toast.fire({ icon: 'success', title: 'Break Started' });
                }
            } catch (e) { Swal.fire('Error', 'Connection Failed', 'error'); }
        }

        function confirmTimeIn(id, name, isOvertime, amount) {
            let htmlMsg = `<p class="text-lg">Welcome back, <b>${name}</b></p>`;
            if(isOvertime) htmlMsg += `<div class="mt-3 bg-rose-900/30 border border-rose-500/50 p-2 rounded-lg text-rose-400 text-sm font-bold flex items-center justify-center gap-2"><i data-lucide="alert-triangle" class="w-4 h-4"></i> Overtime: ${amount}m</div>`;
            
            Swal.fire({
                title: 'End Break?',
                html: htmlMsg,
                showCancelButton: true,
                confirmButtonText: 'Clock In',
                confirmButtonColor: '#10b981',
                background: '#1e293b',
                didOpen: () => lucide.createIcons()
            }).then((result) => {
                if (result.isConfirmed) submitTimeIn(id);
            });
        }

        async function submitTimeIn(id) {
            Swal.fire({ title: '', html: '<i data-lucide="loader-2" class="w-10 h-10 animate-spin text-emerald-500"></i>', showConfirmButton: false, background: 'transparent', didOpen: () => lucide.createIcons() });
            try {
                const res = await fetch(`${API_URL}/timein`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });
                if(res.ok) {
                    await fetchData(true);
                    Swal.close();
                    Toast.fire({ icon: 'success', title: 'Clocked In' });
                }
            } catch (e) { Swal.fire('Error', 'Connection Failed', 'error'); }
        }

        // --- SEARCH LISTENER ---
        document.getElementById('searchBar').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const placeholder = document.getElementById('staff-placeholder');
            const grid = document.getElementById('staffGrid');

            if (currentTab === 'staff') {
                if (term.length === 0) {
                    grid.innerHTML = '';
                    placeholder.classList.remove('hidden');
                    document.getElementById('staff-not-found').classList.add('hidden');
                    document.getElementById('itemCount').innerText = "0";
                } else {
                    const filtered = allStaff.filter(p => p.name_en.toLowerCase().includes(term) || (p.id && p.id.toString().includes(term)));
                    placeholder.classList.add('hidden');
                    renderStaff(filtered, true);
                }
            } else {
                const filtered = activeBreaks.filter(p => p.name.toLowerCase().includes(term) || p.id.toString().includes(term));
                renderActiveBreaks(filtered, true);
            }
        });

        loadData();
    </script>
</body>
</html>
