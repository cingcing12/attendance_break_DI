<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Break Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    animation: { 
                        'float': 'float 6s ease-in-out infinite',
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    },
                    colors: {
                        glass: "rgba(255, 255, 255, 0.7)",
                        glassBorder: "rgba(255, 255, 255, 0.5)",
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f3f4f6;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            background-size: cover;
            min-height: 100vh;
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }
        .staff-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .staff-card:active { transform: scale(0.96); }
    </style>
</head>
<body class="text-slate-800 flex flex-col overflow-x-hidden antialiased selection:bg-indigo-500 selection:text-white">

    <div id="view-selection" class="relative z-20 min-h-screen flex flex-col items-center justify-center p-6">
        <div class="glass-morphism p-10 rounded-[2.5rem] shadow-2xl max-w-lg w-full text-center animate-slide-up relative overflow-hidden">
            <div class="absolute -top-20 -left-20 w-40 h-40 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-float"></div>
            <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-pink-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-float" style="animation-delay: 2s"></div>

            <div class="relative z-10">
                <div class="inline-flex p-4 bg-white rounded-2xl shadow-sm mb-6">
                    <img src="https://cdn-icons-png.flaticon.com/512/3050/3050525.png" class="w-12 h-12" alt="Logo">
                </div>
                <h1 class="text-4xl font-extrabold text-slate-800 mb-2 tracking-tight">Staff Portal</h1>
                <p class="text-slate-500 mb-10 font-medium">Please select your working zone</p>
                
                <div class="flex flex-col gap-4">
                    <button onclick="enterArea('A')" class="group relative overflow-hidden rounded-2xl bg-white p-1 shadow-sm hover:shadow-lg transition-all duration-300 border border-slate-200 hover:border-blue-500">
                        <div class="flex items-center p-4 bg-gradient-to-r from-slate-50 to-white rounded-xl group-hover:from-blue-50 group-hover:to-white transition-colors">
                            <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-2xl font-bold shadow-inner">A</div>
                            <div class="text-left ml-4 flex-1">
                                <h2 class="text-lg font-bold text-slate-800">AREA A</h2>
                                <span class="text-xs font-bold text-blue-500 uppercase tracking-widest">Lounge / Canteen</span>
                            </div>
                            <i data-lucide="chevron-right" class="text-slate-300 group-hover:text-blue-500 transition-colors"></i>
                        </div>
                    </button>

                    <button onclick="enterArea('B')" class="group relative overflow-hidden rounded-2xl bg-white p-1 shadow-sm hover:shadow-lg transition-all duration-300 border border-slate-200 hover:border-rose-500">
                        <div class="flex items-center p-4 bg-gradient-to-r from-slate-50 to-white rounded-xl group-hover:from-rose-50 group-hover:to-white transition-colors">
                            <div class="w-14 h-14 bg-rose-100 text-rose-600 rounded-xl flex items-center justify-center text-2xl font-bold shadow-inner">B</div>
                            <div class="text-left ml-4 flex-1">
                                <h2 class="text-lg font-bold text-slate-800">AREA B</h2>
                                <span class="text-xs font-bold text-rose-500 uppercase tracking-widest">Garden / Outside</span>
                            </div>
                            <i data-lucide="chevron-right" class="text-slate-300 group-hover:text-rose-500 transition-colors"></i>
                        </div>
                    </button>
                </div>

                <div id="loader-initial" class="mt-8 text-xs font-semibold text-slate-400 uppercase tracking-wider flex justify-center items-center gap-2">
                    <i data-lucide="loader-2" class="animate-spin w-3 h-3"></i> Connecting to Server...
                </div>
            </div>
        </div>
    </div>

    <div id="view-dashboard" class="relative z-10 hidden flex-col min-h-screen">
        <header class="glass-morphism border-b-0 m-3 rounded-2xl sticky top-3 z-50 shadow-lg shadow-black/5">
            <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <button onclick="goBack()" class="w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full transition text-slate-600">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        </button>
                        <div>
                            <h1 class="font-bold text-lg text-slate-800 leading-tight">Staff Break</h1>
                            <div class="flex items-center gap-2">
                                <span id="displayArea" class="px-2 py-0.5 rounded-md text-white text-[10px] font-bold shadow-sm">--</span>
                                <span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-md">Total: <span id="itemCount" class="text-slate-700">0</span></span>
                            </div>
                        </div>
                    </div>
                    <div class="relative w-36 md:w-64 group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="search" class="h-4 w-4 text-slate-400 group-focus-within:text-blue-500 transition-colors"></i>
                        </div>
                        <input type="text" id="searchBar" class="block w-full pl-10 pr-3 py-2 border-none rounded-xl bg-slate-100 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:bg-white transition-all shadow-inner" placeholder="Search...">
                    </div>
                </div>
                <div class="flex bg-slate-100/80 p-1 rounded-xl w-full relative">
                    <button onclick="switchTab('staff')" id="tab-staff" class="flex-1 py-2.5 rounded-lg text-sm font-bold transition-all shadow-sm flex justify-center items-center gap-2 bg-white text-slate-800">
                        <i data-lucide="coffee" class="w-4 h-4"></i> Take Break
                    </button>
                    <button onclick="switchTab('active')" id="tab-active" class="flex-1 py-2.5 rounded-lg text-sm font-bold transition-all flex justify-center items-center gap-2 text-slate-500 hover:text-slate-700">
                        <i data-lucide="clock" class="w-4 h-4"></i> Active List
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-grow p-3 md:p-6 pt-0">
            <div class="max-w-7xl mx-auto mt-3">
                <div id="container-staff" class="animate-fade-in pb-24">
                    <div id="staffGrid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-5"></div>
                </div>
                <div id="container-active" class="hidden animate-fade-in pb-24">
                    <div id="activeGrid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-5"></div>
                    <div id="no-active" class="hidden flex flex-col items-center justify-center py-32 text-center">
                        <div class="relative">
                            <div class="absolute inset-0 bg-white/20 blur-xl rounded-full"></div>
                            <div class="relative w-20 h-20 bg-white/10 border border-white/20 rounded-full flex items-center justify-center mb-4 backdrop-blur-md shadow-xl">
                                <i data-lucide="coffee" class="w-8 h-8 text-white/80"></i>
                            </div>
                        </div>
                        <h3 class="text-2xl font-bold text-white mb-2 drop-shadow-md">All Hands on Deck</h3>
                        <p class="text-blue-100 text-sm font-medium">No staff members are currently on break.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            didOpen: (toast) => {
                toast.addEventListener('mouseenter', Swal.stopTimer)
                toast.addEventListener('mouseleave', Swal.resumeTimer)
            }
        });

        const Modal = Swal.mixin({
            customClass: {
                popup: 'rounded-[2rem] p-6',
                title: 'text-2xl font-bold text-slate-800',
                htmlContainer: 'text-slate-600',
                confirmButton: 'px-6 py-3 rounded-xl font-bold text-sm shadow-lg shadow-blue-500/30',
                cancelButton: 'px-6 py-3 rounded-xl font-bold text-sm text-slate-500 hover:bg-slate-50'
            },
            buttonsStyling: false,
            width: '22rem'
        });

        let allStaff = [];
        let activeBreaks = [];
        let currentArea = null;
        let currentTab = 'staff';
        let timerInterval = null;

        lucide.createIcons();

        async function loadData() {
            try {
                // Point to your local server
                const res = await fetch('http://localhost:3000/staff');
                allStaff = await res.json();
                document.getElementById('loader-initial').innerHTML = '<span class="text-green-500 font-bold flex items-center gap-2"><i data-lucide="check-circle" class="w-3 h-3"></i> Ready</span>';
                lucide.createIcons();
                if(currentArea) renderStaff(allStaff);
            } catch (err) {
                document.getElementById('loader-initial').innerHTML = '<span class="text-rose-500 font-bold">Failed to Connect</span>';
            }
        }

        async function fetchActiveBreaks() {
            try {
                const res = await fetch('http://localhost:3000/active-breaks');
                activeBreaks = await res.json();
                renderActiveBreaks(activeBreaks);
            } catch (err) { console.error(err); }
        }

        function enterArea(area) {
            if(allStaff.length === 0) return Toast.fire({ icon: 'info', title: 'Database loading...' });
            
            currentArea = area;
            const display = document.getElementById('displayArea');
            display.innerText = `ZONE ${area}`;
            display.className = area === 'A' 
                ? 'px-2 py-0.5 rounded-md text-white text-[10px] font-bold bg-blue-500 shadow-md shadow-blue-500/40' 
                : 'px-2 py-0.5 rounded-md text-white text-[10px] font-bold bg-rose-500 shadow-md shadow-rose-500/40';

            const selection = document.getElementById('view-selection');
            selection.classList.add('opacity-0', 'scale-95', 'transition-all', 'duration-500');
            setTimeout(() => {
                selection.classList.add('hidden');
                const dash = document.getElementById('view-dashboard');
                dash.classList.remove('hidden');
                dash.classList.add('flex');
            }, 300);
            
            switchTab('staff'); 
        }

        function goBack() {
            currentArea = null;
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('flex');
            
            const selection = document.getElementById('view-selection');
            selection.classList.remove('hidden', 'opacity-0', 'scale-95');
        }

        function switchTab(tab) {
            currentTab = tab;
            const tabStaff = document.getElementById('tab-staff');
            const tabActive = document.getElementById('tab-active');
            const conStaff = document.getElementById('container-staff');
            const conActive = document.getElementById('container-active');
            
            document.getElementById('searchBar').value = '';

            if (tab === 'staff') {
                tabStaff.className = "flex-1 py-2.5 rounded-lg text-sm font-bold transition-all shadow-sm flex justify-center items-center gap-2 bg-white text-slate-800 ring-1 ring-black/5";
                tabActive.className = "flex-1 py-2.5 rounded-lg text-sm font-bold transition-all flex justify-center items-center gap-2 text-slate-400 hover:text-slate-600";
                
                conStaff.classList.remove('hidden');
                conActive.classList.add('hidden');
                clearInterval(timerInterval);
                renderStaff(allStaff); 
            } else {
                tabStaff.className = "flex-1 py-2.5 rounded-lg text-sm font-bold transition-all flex justify-center items-center gap-2 text-slate-400 hover:text-slate-600";
                tabActive.className = "flex-1 py-2.5 rounded-lg text-sm font-bold transition-all shadow-sm flex justify-center items-center gap-2 bg-white text-orange-600 ring-1 ring-orange-200";
                
                conStaff.classList.add('hidden');
                conActive.classList.remove('hidden');
                
                fetchActiveBreaks(); 
                timerInterval = setInterval(() => renderActiveBreaks(activeBreaks), 10000); // Check every 10 secs
            }
        }

        // --- NEW ROBUST TIME CALCULATION ---
        function getMinutesDiff(timeStr) {
            if (!timeStr) return 0;

            // 1. Regex to safely extract HH, MM, and AM/PM
            const parts = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
            if (!parts) return 0; // Return 0 if format is wrong

            let hours = parseInt(parts[1], 10);
            const minutes = parseInt(parts[2], 10);
            const modifier = parts[3].toUpperCase();

            // 2. Convert to 24 Hour format
            if (hours === 12) {
                hours = modifier === 'PM' ? 12 : 0;
            } else {
                hours = modifier === 'PM' ? hours + 12 : hours;
            }

            // 3. Create Date Objects
            const now = new Date();
            const breakDate = new Date();
            breakDate.setHours(hours, minutes, 0, 0);

            // 4. Handle "Yesterday" case
            // If break time is in the future relative to 'now', it means it happened yesterday
            if (breakDate > now) {
                breakDate.setDate(breakDate.getDate() - 1);
            }

            // 5. Calculate Difference
            const diffMs = now - breakDate;
            const diffMins = Math.floor(diffMs / 1000 / 60);

            return diffMins > 0 ? diffMins : 0;
        }

        function renderActiveBreaks(list) {
            const grid = document.getElementById('activeGrid');
            const emptyMsg = document.getElementById('no-active');
            grid.innerHTML = '';

            const filteredList = list.filter(item => item.area === currentArea);
            document.getElementById('itemCount').innerText = filteredList.length;

            if (filteredList.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            } else {
                emptyMsg.classList.add('hidden');
            }

            filteredList.forEach((item, index) => {
                const staffInfo = allStaff.find(s => s.id == item.id);
                const imgUrl = staffInfo ? staffInfo.image : `https://ui-avatars.com/api/?background=random&name=${encodeURIComponent(item.name)}`;

                // Use the new robust function
                const minsGone = getMinutesDiff(item.timeOut);
                
                const isOvertime = minsGone > 15;
                const overtimeAmount = minsGone - 15;

                const delay = index * 50; 
                let borderClass = isOvertime ? "border-2 border-rose-500 shadow-rose-500/20 shadow-lg animate-pulse-slow" : "border border-white/50";
                let statusBadge = isOvertime
                    ? `<span class="absolute top-2 right-2 bg-rose-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">+${overtimeAmount}m</span>`
                    : `<span class="absolute top-2 right-2 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">OK</span>`;
                let timeColor = isOvertime ? "text-rose-600" : "text-slate-800";

                const card = document.createElement('div');
                card.className = `glass-morphism rounded-2xl p-4 flex flex-col items-center text-center relative animate-slide-up ${borderClass}`;
                card.style.animationDelay = `${delay}ms`;
                
                card.innerHTML = `
                    ${statusBadge}
                    <div class="relative mb-2">
                        <img src="${imgUrl}" class="w-16 h-16 rounded-full object-cover shadow-md border-2 border-white bg-slate-100" onerror="this.src='https://ui-avatars.com/api/?name=?'">
                        <div class="absolute bottom-0 right-0 w-4 h-4 bg-orange-400 border-2 border-white rounded-full"></div>
                    </div>
                    
                    <h3 class="font-bold text-slate-800 text-sm leading-tight truncate w-full mb-3">${item.name}</h3>
                    
                    <div class="bg-white/60 rounded-xl p-2 w-full border border-white/50 mb-3">
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Elapsed</p>
                        <p class="text-2xl font-black ${timeColor} leading-none my-0.5">${minsGone}<span class="text-xs font-bold text-slate-400">m</span></p>
                        <p class="text-[10px] text-slate-500">Out: ${item.timeOut}</p>
                    </div>
                    
                    <button onclick="confirmTimeIn('${item.id}', '${item.name}', ${isOvertime}, ${overtimeAmount})" 
                        class="w-full bg-slate-800 hover:bg-slate-900 active:scale-95 text-white py-2.5 rounded-xl font-bold text-xs shadow-lg shadow-slate-300 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="log-in" class="w-3.5 h-3.5"></i> Clock In
                    </button>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function renderStaff(list) {
            const grid = document.getElementById('staffGrid');
            grid.innerHTML = '';
            document.getElementById('itemCount').innerText = list.length;
            
            list.forEach((person, index) => {
                const displayId = person.id_di || person.id || '...';
                const displayGroup = person.group_di || person.group || 'Staff';

                const imgUrl = person.image || `https://ui-avatars.com/api/?background=random&name=${encodeURIComponent(person.name_en)}`;
                const btnClass = currentArea === 'A' 
                    ? 'bg-blue-600 hover:bg-blue-700 shadow-blue-500/30' 
                    : 'bg-rose-600 hover:bg-rose-700 shadow-rose-500/30';
                
                const delay = index < 12 ? index * 30 : 0; 

                const card = document.createElement('div');
                card.className = "staff-card glass-morphism rounded-2xl p-3 flex flex-col items-center text-center relative animate-slide-up hover:shadow-xl";
                card.style.animationDelay = `${delay}ms`;
                
                card.innerHTML = `
                    <div class="absolute top-2 left-2 px-1.5 py-0.5 bg-slate-100 rounded text-[9px] font-bold text-slate-400">#${displayId}</div>
                    
                    <div class="relative mb-2 mt-1">
                        <img src="${imgUrl}" class="w-16 h-16 rounded-full object-cover shadow-sm border-2 border-white bg-slate-100" loading="lazy" onerror="this.src='https://ui-avatars.com/api/?name=?'">
                    </div>
                    
                    <h3 class="font-bold text-slate-800 text-sm truncate w-full leading-tight mb-0.5">${person.name_en}</h3>
                    <p class="text-[10px] text-slate-500 font-medium mb-3 uppercase tracking-wide truncate w-full bg-slate-50/50 rounded py-0.5 px-1">${displayGroup}</p>
                    
                    <button onclick='confirmStartBreak(${JSON.stringify(person).replace(/'/g, "&#39;")})' class="w-full ${btnClass} text-white py-2 rounded-xl font-bold text-xs shadow-lg transition-all flex items-center justify-center gap-1.5 active:scale-95">
                        <i data-lucide="coffee" class="w-3.5 h-3.5"></i> Break
                    </button>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function confirmStartBreak(person) {
            const color = currentArea === 'A' ? '#3b82f6' : '#f43f5e';
            const recordGroup = person.group_di || person.group;
            const recordId = person.id_di || person.id;

            Modal.fire({
                title: `<span style="color:${color}">Start Break</span>`,
                html: `
                    <div class="flex flex-col items-center gap-2">
                        <img src="${person.image || 'https://via.placeholder.com/50'}" class="w-16 h-16 rounded-full border-2 border-slate-100 object-cover">
                        <div>
                            <p class="font-bold text-lg text-slate-800">${person.name_en}</p>
                            <p class="text-sm text-slate-400">Starting break in <b style="color:${color}">Zone ${currentArea}</b>?</p>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Yes, Start',
                cancelButtonText: 'Cancel',
                confirmButtonColor: color,
                background: '#fff',
            }).then((result) => {
                if (result.isConfirmed) submitBreak(person, recordId, recordGroup);
            });
        }

        async function submitBreak(person, id, group) {
            Swal.fire({
                title: '',
                html: '<div class="flex flex-col items-center"><i data-lucide="loader-2" class="w-10 h-10 animate-spin text-blue-500"></i><p class="mt-2 font-bold text-slate-600">Syncing...</p></div>',
                showConfirmButton: false,
                background: 'rgba(255,255,255,0.9)',
                backdrop: `rgba(0,0,0,0.3)`,
                didOpen: () => lucide.createIcons()
            });

            try {
                const res = await fetch('http://localhost:3000/break', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        id: id, 
                        name: person.name_en, 
                        group: group, 
                        area: currentArea 
                    })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    Toast.fire({ icon: 'success', title: `Out at ${data.timeOut}` });
                }
            } catch (e) {
                Toast.fire({ icon: 'error', title: 'Connection Error' });
            }
        }

        function confirmTimeIn(id, name, isOvertime, amount) {
            let htmlContent = `
                <div class="text-center">
                    <p class="text-lg">Welcome back, <b>${name}</b></p>
                </div>
            `;
            let iconType = 'question';
            
            if(isOvertime) {
                htmlContent += `
                    <div class="mt-4 bg-rose-50 border border-rose-100 p-3 rounded-xl flex items-center gap-3 text-left">
                        <div class="bg-rose-100 p-2 rounded-full text-rose-600"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>
                        <div>
                            <p class="text-rose-700 font-bold text-sm">Overtime Alert</p>
                            <p class="text-rose-500 text-xs">Exceeded by ${amount} minutes.</p>
                        </div>
                    </div>
                `;
                iconType = 'warning';
            }

            Modal.fire({
                title: 'End Break?',
                html: htmlContent,
                icon: isOvertime ? null : 'question', 
                showCancelButton: true,
                confirmButtonText: 'Clock In',
                confirmButtonColor: '#10b981',
                didOpen: () => lucide.createIcons()
            }).then((result) => {
                if (result.isConfirmed) submitTimeIn(id);
            });
        }

        async function submitTimeIn(id) {
            Swal.showLoading();
            try {
                const res = await fetch('http://localhost:3000/timein', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    Toast.fire({ icon: 'success', title: 'Clocked In!' });
                    fetchActiveBreaks();
                }
            } catch (e) {
                Toast.fire({ icon: 'error', title: 'Connection Error' });
            }
        }

        document.getElementById('searchBar').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            if (currentTab === 'staff') {
                const filtered = allStaff.filter(p => p.name_en.toLowerCase().includes(term) || (p.id_di && p.id_di.toString().includes(term)) || p.id.toString().includes(term));
                renderStaff(filtered);
            } else {
                const filtered = activeBreaks.filter(p => p.name.toLowerCase().includes(term) || p.id.toString().includes(term));
                renderActiveBreaks(filtered);
            }
        });

        loadData();
    </script>
    <style>
        .swal2-html-container i { display: inline-block; vertical-align: middle; }
    </style>
</body>
</html>
